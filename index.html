<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>🎃 할로윈 타투스티커</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0e101a;
      color: #f3f4f6;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 8px 12px;
    }

    .container {
      width: 100%;
      max-width: 960px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 헤더 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #23293f;
      padding-bottom: 6px;
      flex-shrink: 0;
    }
    .title { font-size: 1.15rem; font-weight: 800; color: #ff7828; }
    .mode-switch-btn {
      border: 1px solid #374151;
      background: #1e2238;
      color: #9ca3af;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .mode-switch-btn.admin-on { background: #ff7828; color: #ffffff; border-color: #ff7828; }

    /* 고대비 굵은 공지 배너 */
    .notice-banner {
      display: none;
      background: #ff5722;
      border: 2px solid #ffd54f;
      border-radius: 10px;
      padding: 8px 12px;
      text-align: center;
      color: #ffffff;
      font-weight: 900;
      font-size: 0.95rem;
      line-height: 1.35;
      box-shadow: 0 0 16px rgba(255, 87, 34, 0.6);
      flex-shrink: 0;
      animation: pulseNotice 2s infinite ease-in-out;
    }
    @keyframes pulseNotice {
      0%, 100% { box-shadow: 0 0 14px rgba(255, 87, 34, 0.5); }
      50% { box-shadow: 0 0 24px rgba(255, 213, 79, 0.9); }
    }

    /* 반응형 2컬럼 레이아웃 (가로 모드 및 넓은 화면) */
    .content-area {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      min-height: 0;
    }

    @media (orientation: landscape) and (min-height: 400px), (min-width: 680px) {
      .content-area {
        grid-template-columns: 1.1fr 0.9fr;
      }
    }

    .col-left, .col-right {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    /* 카드 공통 */
    .card {
      background: #171b2d;
      border: 1px solid #28304f;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-title { font-size: 0.88rem; font-weight: 800; color: #ffffff; }

    /* 전광판 카드 */
    .board {
      background: #171b2d;
      border: 1px solid #28304f;
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
      flex-shrink: 0;
    }
    .board-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 800;
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .call-num { font-size: 2.1rem; font-weight: 900; color: #ff7828; line-height: 1.05; margin: 2px 0; }
    .call-name { font-size: 0.95rem; font-weight: 800; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .call-opt { font-size: 0.78rem; color: #fde047; font-weight: 700; }

    /* 입력 폼 */
    .form-group { display: flex; flex-direction: column; gap: 3px; }
    .form-group label { font-size: 0.72rem; font-weight: 700; color: #9ca3af; }
    .form-group input {
      background: #0f121e;
      border: 1px solid #28304f;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.88rem;
      color: #ffffff;
      outline: none;
    }
    .form-group input:focus { border-color: #ff7828; }

    .option-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .option-item {
      background: #0f121e;
      border: 1px solid #28304f;
      border-radius: 8px;
      padding: 6px 2px;
      text-align: center;
      cursor: pointer;
    }
    .option-item .cnt { font-size: 0.82rem; font-weight: 800; color: #ffffff; }
    .option-item .prc { font-size: 0.7rem; font-weight: 700; color: #9ca3af; margin-top: 1px; }
    .option-item.active { border-color: #ff7828; background: rgba(255, 120, 40, 0.18); }
    .option-item.active .cnt { color: #ff7828; }
    .option-item.active .prc { color: #fde047; }

    .btn-main {
      background: #10b981;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
    }

    /* 관리자 전용 */
    .admin-current-info {
      background: #0f121e;
      border: 1px solid #28304f;
      border-radius: 8px;
      padding: 6px 8px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: #fde047;
    }
    .admin-controls { display: grid; grid-template-columns: 2fr 1fr; gap: 6px; }
    .btn-call { background: #ff7828; color: #ffffff; border: none; border-radius: 8px; padding: 10px; font-size: 0.92rem; font-weight: 800; cursor: pointer; }
    .btn-finish { background: #28304f; color: #e5e7eb; border: none; border-radius: 8px; padding: 10px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }

    .quick-preset-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .preset-btn { background: #0f121e; border: 1px solid #28304f; color: #d1d5db; border-radius: 6px; padding: 4px 6px; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
    .notice-toggle-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-notice-on { background: #ff7828; color: #fff; border: none; padding: 7px; border-radius: 6px; font-size: 0.8rem; font-weight: 800; cursor: pointer; }
    .btn-notice-off { background: #28304f; color: #9ca3af; border: none; padding: 7px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .btn-reset-all { background: #374151; color: #f87171; border: none; border-radius: 6px; padding: 7px; font-size: 0.75rem; font-weight: 700; cursor: pointer; margin-top: 4px; }

    /* 대기 리스트 카드 & 무한 롤링 티커 */
    .queue-card-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .ticker-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .ticker-track {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: tickerRoll 24s linear infinite;
    }
    .ticker-viewport:hover .ticker-track,
    .ticker-viewport:active .ticker-track {
      animation-play-state: paused;
    }
    @keyframes tickerRoll {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    .queue-box-static {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .queue-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f121e;
      border: 1px solid #28304f;
      border-radius: 8px;
      padding: 8px 10px;
      flex-shrink: 0;
    }
    .q-left { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
    .q-badge { font-size: 0.95rem; font-weight: 900; color: #ff7828; }
    .q-name { font-weight: 700; color: #ffffff; }
    .q-opt { font-size: 0.72rem; color: #fde047; font-weight: 600; }
    .btn-del { background: #374151; color: #ef4444; border: none; padding: 4px 8px; border-radius: 5px; font-size: 0.7rem; font-weight: 700; cursor: pointer; }

    /* 토스트 알림 */
    .toast {
      display: none;
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff7828;
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      z-index: 1000;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- 헤더 ('부스' 삭제) -->
  <header class="header">
    <div class="title" id="pageTitle">🎃 할로윈 타투스티커</div>
    <button type="button" class="mode-switch-btn" id="modeBtn" onclick="switchViewMode()">⚙️ 관리자 모드</button>
  </header>

  <!-- 강조 공지 배너 -->
  <div id="noticeBanner" class="notice-banner"></div>

  <!-- ==================== 손님 화면 ==================== -->
  <div id="guestView" class="content-area">
    <!-- 좌측 컬럼: 전광판 + 등록 폼 -->
    <div class="col-left">
      <section class="board">
        <div class="board-tag" id="statusBadge">지금 진행 중!</div>
        <div class="call-num" id="liveNum">0번</div>
        <div class="call-name" id="liveName">준비 중</div>
        <div class="call-opt" id="liveOpt"></div>
      </section>

      <div class="card" style="flex: 1; justify-content: space-around;">
        <div class="form-group">
          <label>원하는 닉네임 (또는 이름)</label>
          <input type="text" id="custName" placeholder="예: 호박마녀, 수아, 번개맨" maxlength="10" />
        </div>
        <div class="form-group">
          <label>타투스티커 수량 선택</label>
          <div class="option-grid">
            <div class="option-item active" onclick="pickOption(this, '타투스티커 1장', '1,000원')">
              <div class="cnt">타투 1장</div>
              <div class="prc">1,000원</div>
            </div>
            <div class="option-item" onclick="pickOption(this, '타투스티커 2장', '2,000원')">
              <div class="cnt">타투 2장</div>
              <div class="prc">2,000원</div>
            </div>
            <div class="option-item" onclick="pickOption(this, '타투스티커 3장', '3,000원')">
              <div class="cnt">타투 3장</div>
              <div class="prc">3,000원</div>
            </div>
          </div>
        </div>
        <button type="button" class="btn-main" onclick="registerQueue()">번호표 등록하기</button>
      </div>
    </div>

    <!-- 우측 컬럼: 롤링 대기 명단 -->
    <div class="col-right">
      <div class="card queue-card-wrapper">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <span class="card-title">실시간 대기 명단</span>
          <span style="color: #ff7828; font-weight: 800; font-size: 0.82rem;" id="guestWaitCountText">대기 0명</span>
        </div>
        <div class="ticker-viewport" id="guestViewport">
          <div class="ticker-track" id="guestTickerTrack">
            <div style="text-align: center; color: #9ca3af; font-size: 0.8rem; padding: 25px 0;">대기 중인 사람이 없습니다.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 관리자 화면 ==================== -->
  <div id="adminView" class="content-area" style="display: none;">
    <!-- 좌측 컬럼: 호출 컨트롤 + 공지 설정 -->
    <div class="col-left">
      <section class="board">
        <div class="board-tag" id="adminStatusBadge">지금 진행 중!</div>
        <div class="call-num" id="adminLiveNum">0번</div>
        <div class="call-name" id="adminLiveName">준비 중</div>
        <div class="call-opt" id="adminLiveOpt"></div>
      </section>

      <div class="card">
        <div class="admin-current-info" id="adminCurrentInfo">현재 대기 중 (호출 대기)</div>
        <div class="admin-controls">
          <button type="button" class="btn-call" onclick="callNextDirect()">📢 다음 손님 호출</button>
          <button type="button" class="btn-finish" onclick="finishCurrentDirect()">완료</button>
        </div>
      </div>

      <div class="card">
        <div class="quick-preset-row">
          <button type="button" class="preset-btn" onclick="setPresetMemo('☕ 30분간 잠시 쉬어갑니다! (대기 접수 가능)')">☕ 30분 휴식</button>
          <button type="button" class="preset-btn" onclick="setPresetMemo('🍙 점심시간입니다! (13:30부터 순번대로 시작)')">🍙 식사 시간</button>
          <button type="button" class="preset-btn" onclick="setPresetMemo('🎨 스티커 물품 재정비 중입니다!')">🎨 재정비</button>
        </div>
        <input type="text" id="noticeInput" placeholder="손님 화면 강조 공지 문구 입력" maxlength="40" style="background:#0f121e; border:1px solid #28304f; border-radius:6px; padding:6px 8px; font-size:0.8rem; color:#fff; outline:none;" />
        <div class="notice-toggle-btns">
          <button type="button" class="btn-notice-on" onclick="enableNotice()">📢 공지 띄우기</button>
          <button type="button" class="btn-notice-off" onclick="disableNotice()">공지 끄기</button>
        </div>
      </div>
    </div>

    <!-- 우측 컬럼: 대기 취소 관리 -->
    <div class="col-right">
      <div class="card queue-card-wrapper">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <span class="card-title">대기열 실시간 관리</span>
          <span style="color: #ff7828; font-weight: 800; font-size: 0.82rem;" id="adminWaitCountText">총 0명</span>
        </div>
        <div class="queue-box-static" id="adminQueueList">
          <div style="text-align: center; color: #9ca3af; font-size: 0.8rem; padding: 25px 0;">대기 중인 사람이 없습니다.</div>
        </div>
        <button type="button" class="btn-reset-all" onclick="resetQueue()">⚠️ 전체 초기화</button>
      </div>
    </div>
  </div>

</div>

<div id="toastBox" class="toast"></div>

<script>
  var ADMIN_PIN = "0000";
  var currentView = sessionStorage.getItem("hal_view_mode") || "guest";
  var lastRenderedJson = "";

  var appData = {
    currentNum: 0,
    currentName: "준비 중",
    currentOpt: "",
    lastNum: 0,
    list: [],
    noticeText: "",
    isNoticeActive: false
  };

  var curOpt = { count: "타투스티커 1장", price: "1,000원" };

  function loadData() {
    try {
      var saved = localStorage.getItem("hal_tab_data");
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed && typeof parsed.lastNum === "number") {
          appData = parsed;
          if (appData.noticeText === undefined) appData.noticeText = "";
          if (appData.isNoticeActive === undefined) appData.isNoticeActive = false;
        }
      }
    } catch (e) {}
  }

  function saveData() {
    try {
      localStorage.setItem("hal_tab_data", JSON.stringify(appData));
    } catch (e) {}
  }

  function applyViewMode() {
    if (currentView === "admin") {
      document.getElementById("modeBtn").innerText = "👤 손님 화면";
      document.getElementById("modeBtn").className = "mode-switch-btn admin-on";
      document.getElementById("pageTitle").innerText = "🛠️ 관리자 모드";
      document.getElementById("guestView").style.display = "none";
      document.getElementById("adminView").style.display = "grid";
      if (document.getElementById("noticeInput")) {
        document.getElementById("noticeInput").value = appData.noticeText || "";
      }
    } else {
      document.getElementById("modeBtn").innerText = "⚙️ 관리자 모드";
      document.getElementById("modeBtn").className = "mode-switch-btn";
      document.getElementById("pageTitle").innerText = "🎃 할로윈 타투스티커";
      document.getElementById("guestView").style.display = "grid";
      document.getElementById("adminView").style.display = "none";
    }
  }

  function switchViewMode() {
    if (currentView === "admin") {
      currentView = "guest";
      sessionStorage.setItem("hal_view_mode", "guest");
      applyViewMode();
    } else {
      var pin = prompt("관리자 비밀번호를 입력하세요 (기본: 0000):");
      if (pin === ADMIN_PIN) {
        currentView = "admin";
        sessionStorage.setItem("hal_view_mode", "admin");
        applyViewMode();
      } else if (pin !== null) {
        alert("비밀번호가 일치하지 않습니다.");
      }
    }
    render(true);
  }

  function setPresetMemo(text) {
    document.getElementById("noticeInput").value = text;
  }

  function enableNotice() {
    var val = document.getElementById("noticeInput").value.trim();
    if (!val) {
      alert("공지 문구를 입력해 주세요.");
      return;
    }
    appData.noticeText = val;
    appData.isNoticeActive = true;
    saveData();
    render(true);
    showToast("📢 강조 공지가 화면에 등록되었습니다!");
  }

  function disableNotice() {
    appData.isNoticeActive = false;
    saveData();
    render(true);
    showToast("공지 배너를 내렸습니다.");
  }

  function pickOption(el, count, price) {
    var items = document.querySelectorAll(".option-item");
    for (var i = 0; i < items.length; i++) {
      items[i].className = "option-item";
    }
    el.className = "option-item active";
    curOpt = { count: count, price: price };
  }

  function registerQueue() {
    var input = document.getElementById("custName");
    var name = input.value.trim();
    if (!name) {
      name = "귀요미" + (appData.lastNum + 1);
    }

    appData.lastNum += 1;
    var optStr = curOpt.count + " (" + curOpt.price + ")";
    var item = {
      num: appData.lastNum,
      name: name,
      opt: optStr
    };

    appData.list.push(item);
    input.value = "";
    saveData();
    render(true);

    showToast("🎉 #" + item.num + "번 " + item.name + " 님 접수 완료!");
    playChime(600, 0.15);
  }

  function callNextDirect() {
    if (appData.list.length === 0) {
      alert("다음 손님이 없습니다.");
      return;
    }
    var next = appData.list.shift();
    appData.currentNum = next.num;
    appData.currentName = next.name;
    appData.currentOpt = next.opt;
    saveData();
    render(true);
    playChime(880, 0.3);
  }

  function finishCurrentDirect() {
    if (appData.currentNum === 0) {
      alert("진행 중인 손님이 없습니다.");
      return;
    }
    appData.currentNum = 0;
    appData.currentName = "준비 중";
    appData.currentOpt = "";
    saveData();
    render(true);
  }

  function delOne(num) {
    if (!confirm("#" + num + "번 대기자를 취소하시겠습니까?")) return;
    appData.list = appData.list.filter(function(i) { return i.num !== num; });
    saveData();
    render(true);
  }

  function resetQueue() {
    if (!confirm("전체 대기열을 초기화하시겠습니까?")) return;
    appData = {
      currentNum: 0,
      currentName: "준비 중",
      currentOpt: "",
      lastNum: 0,
      list: [],
      noticeText: "",
      isNoticeActive: false
    };
    saveData();
    render(true);
  }

  function showToast(msg) {
    var toast = document.getElementById("toastBox");
    toast.innerText = msg;
    toast.style.display = "block";
    setTimeout(function() {
      toast.style.display = "none";
    }, 2400);
  }

  function playChime(freq, dur) {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    } catch(e){}
  }

  function render(force) {
    var currentJson = JSON.stringify(appData);
    if (!force && currentJson === lastRenderedJson) {
      return;
    }
    lastRenderedJson = currentJson;

    // 강조 공지 배너
    var banner = document.getElementById("noticeBanner");
    if (appData.isNoticeActive && appData.noticeText) {
      banner.innerHTML = "📢 <strong>" + appData.noticeText + "</strong>";
      banner.style.display = "block";
    } else {
      banner.style.display = "none";
    }

    // 전광판 갱신
    var isOngoing = appData.currentNum > 0;
    var badgeText = isOngoing ? "진행 중 🎨" : "대기 중 💤";
    var numText = isOngoing ? "#" + appData.currentNum + "번" : "-";
    var nameText = isOngoing ? appData.currentName + " 님" : "다음 손님을 호출해 주세요";
    var optText = isOngoing ? "[" + appData.currentOpt + "]" : "";

    document.getElementById("statusBadge").innerText = badgeText;
    document.getElementById("liveNum").innerText = numText;
    document.getElementById("liveName").innerText = nameText;
    document.getElementById("liveOpt").innerText = optText;

    if (document.getElementById("adminStatusBadge")) {
      document.getElementById("adminStatusBadge").innerText = badgeText;
      document.getElementById("adminLiveNum").innerText = numText;
      document.getElementById("adminLiveName").innerText = nameText;
      document.getElementById("adminLiveOpt").innerText = optText;
    }

    var adminCurrentInfo = document.getElementById("adminCurrentInfo");
    if (adminCurrentInfo) {
      adminCurrentInfo.innerHTML = isOngoing
        ? "👉 <strong>#" + appData.currentNum + "번 " + appData.currentName + " 님</strong> [" + appData.currentOpt + "]"
        : "현재 대기 중 (호출 버튼 클릭)";
    }

    var waitCount = appData.list.length;
    document.getElementById("guestWaitCountText").innerText = "대기 " + waitCount + "명 (약 " + (waitCount * 3) + "분)";
    if (document.getElementById("adminWaitCountText")) {
      document.getElementById("adminWaitCountText").innerText = "총 " + waitCount + "명";
    }

    // 롤링 대기 명단 구성
    var tickerTrack = document.getElementById("guestTickerTrack");
    if (waitCount === 0) {
      tickerTrack.style.animation = "none";
      tickerTrack.innerHTML = '<div style="text-align: center; color: #9ca3af; font-size: 0.8rem; padding: 25px 0;">대기 중인 사람이 없습니다.</div>';
    } else {
      var itemHtml = "";
      for (var i = 0; i < waitCount; i++) {
        var row = appData.list[i];
        itemHtml += '<div class="queue-row">' +
                      '<div class="q-left">' +
                        '<span class="q-badge">#' + row.num + '</span>' +
                        '<span class="q-name">' + row.name + '</span>' +
                        '<span class="q-opt">[' + row.opt + ']</span>' +
                      '</div>' +
                      '<div style="font-size: 0.72rem; color: #9ca3af; font-weight: 700;">' + (i + 1) + '번째</div>' +
                    '</div>';
      }

      if (waitCount >= 3) {
        tickerTrack.innerHTML = itemHtml + itemHtml;
        var rollDuration = Math.max(12, waitCount * 3.5);
        tickerTrack.style.animation = "tickerRoll " + rollDuration + "s linear infinite";
      } else {
        tickerTrack.style.animation = "none";
        tickerTrack.innerHTML = itemHtml;
      }
    }

    // 관리자 정적 대기 리스트
    var adminList = document.getElementById("adminQueueList");
    if (adminList) {
      if (waitCount === 0) {
        adminList.innerHTML = '<div style="text-align: center; color: #9ca3af; font-size: 0.8rem; padding: 25px 0;">대기 중인 사람이 없습니다.</div>';
      } else {
        var aHtml = "";
        for (var j = 0; j < waitCount; j++) {
          var item = appData.list[j];
          aHtml += '<div class="queue-row">' +
                     '<div class="q-left">' +
                       '<span class="q-badge">#' + item.num + '</span>' +
                       '<span class="q-name">' + item.name + '</span>' +
                       '<span class="q-opt">[' + item.opt + ']</span>' +
                     '</div>' +
                     '<div>' +
                       '<button type="button" class="btn-del" onclick="delOne(' + item.num + ')">취소</button>' +
                     '</div>' +
                   '</div>';
        }
        adminList.innerHTML = aHtml;
      }
    }
  }

  window.addEventListener('storage', function() {
    loadData();
    render(false);
  });

  loadData();
  applyViewMode();
  render(true);
</script>
</body>
</html>
