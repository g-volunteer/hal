<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>할로윈 타투 부스 실시간 웨이팅</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #11131f;
      --card-bg: #1c2035;
      --orange: #ff7828;
      --orange-glow: rgba(255, 120, 40, 0.35);
      --purple: #8b5cf6;
      --green: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2e3553;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 40px; }

    /* 상단 헤더 */
    .header-nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .brand { font-size: 1.2rem; font-weight: 800; color: var(--orange); display: flex; align-items: center; gap: 6px; }
    .role-toggle { display: flex; background: var(--card-bg); border-radius: 999px; padding: 3px; border: 1px solid var(--border); }
    .role-btn { border: none; background: none; color: var(--text-muted); font-size: 0.8rem; font-weight: 700; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
    .role-btn.active { background: var(--orange); color: #fff; }

    /* 전광판 카드 */
    .status-board {
      background: linear-gradient(145deg, #1f2540, #161a2e);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--green);
      background: rgba(16, 185, 129, 0.12);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .live-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; }

    .calling-box { margin: 10px 0; }
    .calling-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .calling-num { font-size: 3.5rem; font-weight: 900; color: var(--orange); letter-spacing: -1px; text-shadow: 0 0 20px var(--orange-glow); line-height: 1.1; margin: 4px 0; }
    .calling-name { font-size: 1.1rem; font-weight: 700; color: #fff; }

    .stats-row { display: flex; justify-content: space-around; border-top: 1px dashed var(--border); padding-top: 14px; margin-top: 14px; }
    .stat-item .val { font-size: 1.3rem; font-weight: 800; color: #fff; }
    .stat-item .lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    /* 손님 티켓 */
    .my-ticket-card {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(255, 120, 40, 0.18));
      border: 1px solid var(--purple);
      border-radius: 20px;
      padding: 22px;
      text-align: center;
    }
    .ticket-head { font-size: 0.85rem; color: #d8b4fe; font-weight: 700; margin-bottom: 4px; }
    .ticket-num { font-size: 3.2rem; font-weight: 900; color: #fff; line-height: 1; margin: 8px 0; }
    .ticket-option-info { font-size: 0.95rem; color: #fde047; font-weight: 700; margin-bottom: 8px; }
    .waiting-ahead { font-size: 1.15rem; color: var(--orange); font-weight: 800; margin-bottom: 12px; }
    .ticket-alert-box { background: rgba(0,0,0,0.35); border-radius: 12px; padding: 12px; font-size: 0.85rem; line-height: 1.5; color: #e5e7eb; }
    .ticket-alert-box.ready { background: var(--orange); color: #fff; font-weight: 800; }

    /* 입력 폼 */
    .form-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .form-title { font-size: 1.1rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 6px; }
    .field-group { display: flex; flex-direction: column; gap: 8px; }
    .field-group label { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
    .field-group input { background: #121422; border: 1px solid var(--border); border-radius: 12px; padding: 14px; font-size: 1rem; color: #fff; outline: none; }
    .field-group input:focus { border-color: var(--orange); }

    .price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .price-btn {
      background: #121422;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .price-btn .p-count { font-size: 0.95rem; font-weight: 800; color: var(--text); }
    .price-btn .p-price { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
    .price-btn.active {
      border-color: var(--orange);
      background: rgba(255, 120, 40, 0.15);
    }
    .price-btn.active .p-count { color: var(--orange); }
    .price-btn.active .p-price { color: #fde047; }

    .btn-submit { background: var(--orange); color: #fff; border: none; border-radius: 14px; padding: 16px; font-size: 1.05rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 14px var(--orange-glow); }

    /* 관리자 뷰 */
    .admin-panel { display: flex; flex-direction: column; gap: 14px; }
    .admin-action-row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
    .btn-call { background: var(--orange); color: #fff; border: none; border-radius: 14px; padding: 16px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    .btn-reset { background: #262c45; color: #9ca3af; border: none; border-radius: 14px; padding: 16px; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
    .queue-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 18px; }
    .queue-title { font-size: 0.95rem; font-weight: 800; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .queue-list { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; }
    .queue-item { display: flex; justify-content: space-between; align-items: center; background: #121422; border-radius: 12px; padding: 12px; border: 1px solid var(--border); }
    .queue-info .q-num { font-size: 1.2rem; font-weight: 900; color: var(--orange); }
    .queue-info .q-name { font-size: 0.95rem; font-weight: 700; margin-left: 6px; }
    .queue-info .q-order { font-size: 0.8rem; color: #fde047; font-weight: 700; margin-left: 6px; }
    .queue-actions button { border: none; padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .btn-item-call { background: var(--green); color: #fff; }
    .btn-item-del { background: #374151; color: #9ca3af; margin-left: 4px; }
    .empty-msg { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px 0; }
  </style>
</head>
<body>
<div class="app-container">

  <!-- 헤더 -->
  <header class="header-nav">
    <div class="brand">🎃 타투부스 웨이팅</div>
    <div class="role-toggle">
      <button class="role-btn active" id="btnModeGuest" onclick="setMode('guest')">손님용</button>
      <button class="role-btn" id="btnModeAdmin" onclick="setMode('admin')">부스관리</button>
    </div>
  </header>

  <!-- 실시간 전광판 -->
  <section class="status-board">
    <div class="live-badge"><span class="live-dot"></span> 실시간 전광판</div>
    <div class="calling-box">
      <div class="calling-label">지금 부스로 오세요!</div>
      <div class="calling-num" id="liveCallingNum">0번</div>
      <div class="calling-name" id="liveCallingName">부스 준비 중</div>
    </div>
    <div class="stats-row">
      <div class="stat-item">
        <div class="val" id="liveWaitCount">0명</div>
        <div class="lbl">현재 대기 팀</div>
      </div>
      <div class="stat-item">
        <div class="val" id="liveEstTime">0분</div>
        <div class="lbl">예상 대기 시간</div>
      </div>
    </div>
  </section>

  <!-- 손님 뷰: 번호표 신청 폼 -->
  <div id="guestRegisterSection" class="form-card">
    <div class="form-title">⚡ 줄서기 번호표 등록</div>
    <div class="field-group">
      <label>아이 이름 (또는 닉네임)</label>
      <input type="text" id="inputName" placeholder="예: 수아, 민준이" maxlength="8" />
    </div>
    <div class="field-group">
      <label>타투 수량 선택 (스티커는 현장에서 골라요!)</label>
      <div class="price-grid">
        <div class="price-btn active" onclick="selectOption(this, '타투 1장', '1,000원')">
          <span class="p-count">타투 1장</span>
          <span class="p-price">1,000원</span>
        </div>
        <div class="price-btn" onclick="selectOption(this, '타투 2장', '2,000원')">
          <span class="p-count">타투 2장</span>
          <span class="p-price">2,000원</span>
        </div>
        <div class="price-btn" onclick="selectOption(this, '타투 3장', '3,000원')">
          <span class="p-count">타투 3장</span>
          <span class="p-price">3,000원</span>
        </div>
      </div>
    </div>
    <button class="btn-submit" onclick="submitWaiting()">대기 번호표 발급받기</button>
  </div>

  <!-- 손님 뷰: 내 티켓 화면 -->
  <div id="guestTicketSection" class="my-ticket-card" style="display: none;">
    <div class="ticket-head">나의 대기 번호표</div>
    <div class="ticket-num" id="myTicketNum">#00</div>
    <div class="ticket-option-info" id="myTicketOption">선택: 타투 1장 (1,000원)</div>
    <div class="waiting-ahead" id="myAheadCount">내 앞 대기 0명</div>
    <div class="ticket-alert-box" id="myStatusBox">
      에어바운서에서 신나게 놀고 계세요!<br>실시간 전광판 번호가 되면 부스로 오시면 됩니다.
    </div>
    <button style="background: none; border: none; color: #9ca3af; font-size: 0.8rem; margin-top: 16px; cursor: pointer; text-decoration: underline;" onclick="cancelMyTicket()">대기 취소하기</button>
  </div>

  <!-- 부스 관리자 뷰 -->
  <div id="adminSection" class="admin-panel" style="display: none;">
    <div class="admin-action-row">
      <button class="btn-call" onclick="callNextCustomer()">📢 다음 번호 호출</button>
      <button class="btn-reset" onclick="resetAllData()">전체 초기화</button>
    </div>
    <div class="queue-card">
      <div class="queue-title">
        <span>실시간 대기열</span>
        <span style="color: var(--orange); font-size: 0.85rem;" id="adminQueueCount">총 0명</span>
      </div>
      <div class="queue-list" id="adminQueueList">
        <div class="empty-msg">대기 중인 아이들이 없습니다.</div>
      </div>
    </div>
  </div>

</div>

<script>
  let state = {
    currentCalling: { num: 0, name: "부스 준비 중", option: "" },
    queue: [],
    lastIssuedNum: 0
  };

  let selectedOption = { count: "타투 1장", price: "1,000원" };
  let myWaitingNum = null;

  // 초기화 (화면 즉시 렌더링)
  function init() {
    try {
      const savedNum = localStorage.getItem("my_waiting_num");
      if (savedNum) myWaitingNum = parseInt(savedNum);

      const local = localStorage.getItem("halloween_queue_data");
      if (local) {
        state = JSON.parse(local);
      }
    } catch(e) {
      console.log("로컬 스토리지 로드 예외 처리", e);
    }

    updateUI();
  }

  function setMode(mode) {
    document.getElementById('btnModeGuest').classList.toggle('active', mode === 'guest');
    document.getElementById('btnModeAdmin').classList.toggle('active', mode === 'admin');
    
    if (mode === 'admin') {
      document.getElementById('guestRegisterSection').style.display = 'none';
      document.getElementById('guestTicketSection').style.display = 'none';
      document.getElementById('adminSection').style.display = 'flex';
    } else {
      document.getElementById('adminSection').style.display = 'none';
      renderGuestView();
    }
  }

  function selectOption(elem, count, price) {
    document.querySelectorAll('.price-btn').forEach(btn => btn.classList.remove('active'));
    elem.classList.add('active');
    selectedOption = { count, price };
  }

  function submitWaiting() {
    const input = document.getElementById('inputName');
    const name = input.value.trim() || `아이${state.lastIssuedNum + 1}`;
    
    state.lastIssuedNum += 1;
    const newEntry = {
      num: state.lastIssuedNum,
      name: name,
      option: `${selectedOption.count} (${selectedOption.price})`
    };
    
    state.queue.push(newEntry);
    myWaitingNum = newEntry.num;
    try {
      localStorage.setItem("my_waiting_num", myWaitingNum);
      localStorage.setItem("my_waiting_option", newEntry.option);
      localStorage.setItem("halloween_queue_data", JSON.stringify(state));
    } catch(e){}
    
    input.value = "";
    updateUI();
  }

  function cancelMyTicket() {
    if (!confirm("대기를 취소하시겠습니까?")) return;
    state.queue = state.queue.filter(item => item.num !== myWaitingNum);
    myWaitingNum = null;
    try {
      localStorage.removeItem("my_waiting_num");
      localStorage.removeItem("my_waiting_option");
      localStorage.setItem("halloween_queue_data", JSON.stringify(state));
    } catch(e){}
    updateUI();
  }

  function callNextCustomer() {
    if (state.queue.length === 0) {
      alert("대기 중인 사람이 없습니다.");
      return;
    }
    const next = state.queue.shift();
    state.currentCalling = { num: next.num, name: next.name, option: next.option };
    saveState();
    updateUI();
    playChime();
  }

  function callSpecific(num) {
    const idx = state.queue.findIndex(item => item.num === num);
    if (idx !== -1) {
      const target = state.queue.splice(idx, 1)[0];
      state.currentCalling = { num: target.num, name: target.name, option: target.option };
      saveState();
      updateUI();
      playChime();
    }
  }

  function deleteQueue(num) {
    state.queue = state.queue.filter(item => item.num !== num);
    saveState();
    updateUI();
  }

  function resetAllData() {
    if (!confirm("정말 모든 대기열을 초기화하시겠습니까?")) return;
    state = { currentCalling: { num: 0, name: "부스 준비 중", option: "" }, queue: [], lastIssuedNum: 0 };
    saveState();
    updateUI();
  }

  function saveState() {
    try {
      localStorage.setItem("halloween_queue_data", JSON.stringify(state));
    } catch(e){}
  }

  function updateUI() {
    // 1. 전광판 갱신
    document.getElementById('liveCallingNum').innerText = `${state.currentCalling.num}번`;
    const optionText = state.currentCalling.option ? ` [${state.currentCalling.option}]` : "";
    document.getElementById('liveCallingName').innerText = `${state.currentCalling.name}${optionText}`;
    document.getElementById('liveWaitCount').innerText = `${state.queue.length}명`;
    document.getElementById('liveEstTime').innerText = `${state.queue.length * 3}분`;

    // 2. 관리자 뷰 갱신
    document.getElementById('adminQueueCount').innerText = `총 ${state.queue.length}명 대기`;
    const listEl = document.getElementById('adminQueueList');
    if (state.queue.length === 0) {
      listEl.innerHTML = `<div class="empty-msg">대기 중인 아이들이 없습니다.</div>`;
    } else {
      listEl.innerHTML = state.queue.map(item => `
        <div class="queue-item">
          <div class="queue-info">
            <span class="q-num">#${item.num}</span>
            <span class="q-name">${item.name}</span>
            <span class="q-order">[${item.option}]</span>
          </div>
          <div class="queue-actions">
            <button class="btn-item-call" onclick="callSpecific(${item.num})">호출</button>
            <button class="btn-item-del" onclick="deleteQueue(${item.num})">취소</button>
          </div>
        </div>
      `).join('');
    }

    // 3. 손님 뷰 갱신
    renderGuestView();
  }

  function renderGuestView() {
    const isRegistered = myWaitingNum !== null;
    const regSection = document.getElementById('guestRegisterSection');
    const ticketSection = document.getElementById('guestTicketSection');

    if (!isRegistered) {
      regSection.style.display = 'flex';
      ticketSection.style.display = 'none';
    } else {
      regSection.style.display = 'none';
      ticketSection.style.display = 'block';

      document.getElementById('myTicketNum').innerText = `#${myWaitingNum}`;
      const savedOption = localStorage.getItem("my_waiting_option") || "선택 완료";
      document.getElementById('myTicketOption').innerText = `신청: ${savedOption}`;
      
      const aheadIdx = state.queue.findIndex(item => item.num === myWaitingNum);
      const isCurrent = state.currentCalling.num === myWaitingNum;
      const statusBox = document.getElementById('myStatusBox');

      if (isCurrent) {
        document.getElementById('myAheadCount').innerText = `🎉 지금 입장하세요!`;
        statusBox.className = "ticket-alert-box ready";
        statusBox.innerHTML = `🌟 <strong>내 차례가 되었습니다!</strong><br>부스로 와서 스티커 고르고 예쁘게 붙여요!`;
      } else if (aheadIdx !== -1) {
        document.getElementById('myAheadCount').innerText = `내 앞 대기: ${aheadIdx}명`;
        statusBox.className = "ticket-alert-box";
        statusBox.innerHTML = aheadIdx === 0 
          ? `👉 <strong>다음 순서입니다!</strong> 부스 근처로 와주세요.` 
          : `에어바운서에서 신나게 놀고 계세요!<br>순서가 다가오면 화면에 바로 안내됩니다.`;
      } else {
        document.getElementById('myAheadCount').innerText = `시술 완료 또는 대기 종료`;
        statusBox.className = "ticket-alert-box";
        statusBox.innerHTML = `타투 시술이 완료되었거나 취소되었습니다.`;
      }
    }
  }

  function playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      osc.frequency.setValueAtTime(880.00, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
      osc.start();
      osc.stop(ctx.currentTime + 0.6);
    } catch(e){}
  }

  // 문서 로드 완료 시 즉시 실행
  document.addEventListener("DOMContentLoaded", init);
  window.onload = init;
</script>
</body>
</html>
