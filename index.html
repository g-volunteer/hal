<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎃 할로윈 타투 부스 웨이팅</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background-color: #121420; color: #f3f4f6; display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 14px; padding-bottom: 30px; }

    /* 헤더 */
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2b324b; padding-bottom: 12px; }
    .title { font-size: 1.25rem; font-weight: 800; color: #ff7828; }
    .btn-reset { border: 1px solid #374151; background: #1e2238; color: #9ca3af; font-size: 0.75rem; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

    /* 현재 시술 중 메인 전광판 */
    .board { background: #1c2035; border: 1px solid #2e3553; border-radius: 18px; padding: 18px; text-align: center; }
    .board-tag { display: inline-block; font-size: 0.75rem; font-weight: 700; color: #10b981; background: rgba(16, 185, 129, 0.15); padding: 4px 12px; border-radius: 20px; margin-bottom: 6px; }
    .call-num { font-size: 3.4rem; font-weight: 900; color: #ff7828; line-height: 1.1; margin: 4px 0; }
    .call-name { font-size: 1.15rem; font-weight: 800; color: #ffffff; min-height: 1.4rem; }
    .call-opt { font-size: 0.9rem; color: #fde047; font-weight: 700; margin-top: 4px; }

    /* 관리자 호출 컨트롤 */
    .admin-controls { margin-top: 14px; display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
    .btn-call { background: #ff7828; color: #ffffff; border: none; border-radius: 12px; padding: 14px; font-size: 1rem; font-weight: 800; cursor: pointer; }
    .btn-call:active { filter: brightness(0.9); }
    .btn-finish { background: #2e3553; color: #e5e7eb; border: none; border-radius: 12px; padding: 14px; font-size: 0.9rem; font-weight: 700; cursor: pointer; }

    /* 카드 공통 */
    .card { background: #1c2035; border: 1px solid #2e3553; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .card-title { font-size: 1.05rem; font-weight: 800; color: #ffffff; }

    /* 입력폼 */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: #9ca3af; }
    .form-group input { background: #121422; border: 1px solid #2e3553; border-radius: 12px; padding: 13px; font-size: 1rem; color: #ffffff; outline: none; }
    .form-group input:focus { border-color: #ff7828; }
    
    /* 금액/수량 선택 */
    .option-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .option-item { background: #121422; border: 1px solid #2e3553; border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; transition: 0.2s; }
    .option-item .cnt { font-size: 0.95rem; font-weight: 800; color: #ffffff; }
    .option-item .prc { font-size: 0.8rem; font-weight: 700; color: #9ca3af; margin-top: 4px; }
    .option-item.active { border-color: #ff7828; background: rgba(255, 120, 40, 0.15); }
    .option-item.active .cnt { color: #ff7828; }
    .option-item.active .prc { color: #fde047; }

    .btn-main { background: #10b981; color: #ffffff; border: none; border-radius: 12px; padding: 16px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    .btn-main:active { filter: brightness(0.9); }

    /* 대기 리스트 카드 */
    .queue-box { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
    .queue-row { display: flex; justify-content: space-between; align-items: center; background: #121422; border: 1px solid #2e3553; border-radius: 10px; padding: 10px 14px; }
    .q-left { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; }
    .q-badge { font-size: 1.15rem; font-weight: 900; color: #ff7828; }
    .q-name { font-weight: 700; color: #ffffff; }
    .q-opt { font-size: 0.8rem; color: #fde047; font-weight: 600; }
    .q-acts button { border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .btn-q-call { background: #ff7828; color: #ffffff; }
    .btn-q-del { background: #374151; color: #9ca3af; margin-left: 4px; }

    /* 접수 완료 알림 토스트 */
    .toast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ff7828; color: #fff; padding: 14px 24px; border-radius: 30px; font-weight: 800; font-size: 1rem; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 1000; text-align: center; }
  </style>
</head>
<body>
<div class="container">

  <!-- 헤더 -->
  <header class="header">
    <div class="title">🎃 할로윈 타투 부스</div>
    <button type="button" class="btn-reset" onclick="resetQueue()">부스 마감 / 초기화</button>
  </header>

  <!-- 1. 상단: 현재 시술 중 전광판 & 관리자 호출 버튼 -->
  <section class="board">
    <div class="board-tag" id="statusBadge">지금 시술 중!</div>
    <div class="call-num" id="liveNum">0번</div>
    <div class="call-name" id="liveName">부스 준비 중</div>
    <div class="call-opt" id="liveOpt"></div>
    
    <div class="admin-controls">
      <button type="button" class="btn-call" onclick="callNext()">📢 다음 손님 호출하기</button>
      <button type="button" class="btn-finish" onclick="finishCurrent()">시술 완료</button>
    </div>
  </section>

  <!-- 2. 중앙: 손님 접수 폼 (키오스크 모드) -->
  <div class="card">
    <div class="card-title">⚡ 줄서기 번호표 등록</div>
    <div class="form-group">
      <label>원하는 닉네임 (또는 이름)</label>
      <input type="text" id="custName" placeholder="예: 호박마녀, 수아, 번개맨" maxlength="10" />
    </div>
    <div class="form-group">
      <label>타투 수량 선택 (스티커는 현장에서 골라요!)</label>
      <div class="option-grid">
        <div class="option-item active" onclick="pickOption(this, '타투 1장', '1,000원')">
          <div class="cnt">타투 1장</div>
          <div class="prc">1,000원</div>
        </div>
        <div class="option-item" onclick="pickOption(this, '타투 2장', '2,000원')">
          <div class="cnt">타투 2장</div>
          <div class="prc">2,000원</div>
        </div>
        <div class="option-item" onclick="pickOption(this, '타투 3장', '3,000원')">
          <div class="cnt">타투 3장</div>
          <div class="prc">3,000원</div>
        </div>
      </div>
    </div>
    <button type="button" class="btn-main" onclick="registerQueue()">번호표 등록하기</button>
  </div>

  <!-- 3. 하단: 실시간 대기 현황 리스트 -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span class="card-title">실시간 대기 명단</span>
      <span style="color: #ff7828; font-weight: 800; font-size: 0.95rem;" id="waitCountText">대기 0명 (약 0분)</span>
    </div>
    <div class="queue-box" id="adminList">
      <div style="text-align: center; color: #9ca3af; font-size: 0.85rem; padding: 20px 0;">대기 중인 사람이 없습니다.</div>
    </div>
  </div>

</div>

<!-- 등록 완료 팝업 -->
<div id="toastBox" class="toast"></div>

<script>
  var appData = {
    currentNum: 0,
    currentName: "부스 준비 중",
    currentOpt: "",
    lastNum: 0,
    list: []
  };

  var curOpt = { count: "타투 1장", price: "1,000원" };

  function loadData() {
    try {
      var saved = localStorage.getItem("hal_tab_data");
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed && typeof parsed.lastNum === "number") {
          appData = parsed;
        }
      }
    } catch (e) {}
  }

  function saveData() {
    try {
      localStorage.setItem("hal_tab_data", JSON.stringify(appData));
    } catch (e) {}
  }

  function pickOption(el, count, price) {
    var items = document.querySelectorAll(".option-item");
    for (var i = 0; i < items.length; i++) {
      items[i].className = "option-item";
    }
    el.className = "option-item active";
    curOpt = { count: count, price: price };
  }

  // 손님이 등록 버튼 누를 때
  function registerQueue() {
    var input = document.getElementById("custName");
    var name = input.value.trim();
    if (!name) {
      name = "귀요미" + (appData.lastNum + 1);
    }

    appData.lastNum += 1;
    var optStr = curOpt.count + " (" + curOpt.price + ")";
    var item = {
      num: appData.lastNum,
      name: name,
      opt: optStr
    };

    appData.list.push(item);
    input.value = "";
    saveData();
    render();

    // 등록 확인 토스트 띄우기
    showToast("🎉 #" + item.num + "번 " + item.name + "님 접수 완료! (대기 " + appData.list.length + "번째)");
    playChime(600, 0.15);
  }

  // 관리자가 다음 손님 호출
  function callNext() {
    if (appData.list.length === 0) {
      alert("대기 중인 다음 손님이 없습니다.");
      return;
    }
    var next = appData.list.shift();
    appData.currentNum = next.num;
    appData.currentName = next.name;
    appData.currentOpt = next.opt;
    saveData();
    render();
    playChime(880, 0.3);
  }

  // 특정 손님 바로 호출
  function callOne(num) {
    var idx = -1;
    for (var i = 0; i < appData.list.length; i++) {
      if (appData.list[i].num === num) {
        idx = i;
        break;
      }
    }
    if (idx !== -1) {
      var item = appData.list.splice(idx, 1)[0];
      appData.currentNum = item.num;
      appData.currentName = item.name;
      appData.currentOpt = item.opt;
      saveData();
      render();
      playChime(880, 0.3);
    }
  }

  // 시술 완료 처리
  function finishCurrent() {
    if (appData.currentNum === 0) {
      alert("현재 진행 중인 시술이 없습니다.");
      return;
    }
    appData.currentNum = 0;
    appData.currentName = "부스 준비 중";
    appData.currentOpt = "";
    saveData();
    render();
  }

  // 대기 취소
  function delOne(num) {
    appData.list = appData.list.filter(function(i) { return i.num !== num; });
    saveData();
    render();
  }

  // 전체 초기화
  function resetQueue() {
    if (!confirm("전체 번호표와 대기열을 초기화하시겠습니까?")) return;
    appData = {
      currentNum: 0,
      currentName: "부스 준비 중",
      currentOpt: "",
      lastNum: 0,
      list: []
    };
    saveData();
    render();
  }

  function showToast(msg) {
    var toast = document.getElementById("toastBox");
    toast.innerText = msg;
    toast.style.display = "block";
    setTimeout(function() {
      toast.style.display = "none";
    }, 2800);
  }

  function playChime(freq, dur) {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    } catch(e){}
  }

  function render() {
    // 1. 시술 중 전광판
    if (appData.currentNum > 0) {
      document.getElementById("statusBadge").innerText = "현재 시술 중 🎨";
      document.getElementById("statusBadge").style.background = "rgba(255, 120, 40, 0.2)";
      document.getElementById("statusBadge").style.color = "#ff7828";
      document.getElementById("liveNum").innerText = "#" + appData.currentNum + "번";
      document.getElementById("liveName").innerText = appData.currentName + " 어린이";
      document.getElementById("liveOpt").innerText = "[" + appData.currentOpt + "]";
    } else {
      document.getElementById("statusBadge").innerText = "부스 대기 중 💤";
      document.getElementById("statusBadge").style.background = "rgba(16, 185, 129, 0.15)";
      document.getElementById("statusBadge").style.color = "#10b981";
      document.getElementById("liveNum").innerText = "-";
      document.getElementById("liveName").innerText = "다음 손님을 호출해 주세요";
      document.getElementById("liveOpt").innerText = "";
    }

    // 2. 대기 통계
    var waitCount = appData.list.length;
    document.getElementById("waitCountText").innerText = "대기 " + waitCount + "명 (약 " + (waitCount * 3) + "분)";

    // 3. 대기 리스트
    var adminList = document.getElementById("adminList");
    if (appData.list.length === 0) {
      adminList.innerHTML = '<div style="text-align: center; color: #9ca3af; font-size: 0.85rem; padding: 20px 0;">대기 중인 사람이 없습니다.</div>';
    } else {
      var html = "";
      for (var i = 0; i < appData.list.length; i++) {
        var row = appData.list[i];
        html += '<div class="queue-row">' +
                  '<div class="q-left">' +
                    '<span class="q-badge">#' + row.num + '</span>' +
                    '<span class="q-name">' + row.name + '</span>' +
                    '<span class="q-opt">[' + row.opt + ']</span>' +
                  '</div>' +
                  '<div class="q-acts">' +
                    '<button type="button" class="btn-q-call" onclick="callOne(' + row.num + ')">호출</button>' +
                    '<button type="button" class="btn-q-del" onclick="delOne(' + row.num + ')">취소</button>' +
                  '</div>' +
                '</div>';
      }
      adminList.innerHTML = html;
    }
  }

  loadData();
  render();
</script>
</body>
</html>
