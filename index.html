<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎃 할로윈 타투스티커 부스 웨이팅</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background-color: #121420; color: #f3f4f6; display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 14px; padding-bottom: 30px; }

    /* 헤더 */
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2b324b; padding-bottom: 12px; }
    .title { font-size: 1.25rem; font-weight: 800; color: #ff7828; }
    .mode-switch-btn { border: 1px solid #374151; background: #1e2238; color: #9ca3af; font-size: 0.75rem; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
    .mode-switch-btn.admin-on { background: #ff7828; color: #ffffff; border-color: #ff7828; }

    /* 휴식/공지 배너 */
    .notice-banner {
      display: none;
      background: linear-gradient(135deg, rgba(255, 120, 40, 0.2), rgba(239, 68, 68, 0.2));
      border: 1.5px solid #ff7828;
      border-radius: 14px;
      padding: 14px 16px;
      text-align: center;
      color: #fde047;
      font-weight: 800;
      font-size: 1rem;
      line-height: 1.4;
      box-shadow: 0 4px 14px rgba(255, 120, 40, 0.2);
    }

    /* 전광판 카드 (공통) */
    .board { background: #1c2035; border: 1px solid #2e3553; border-radius: 18px; padding: 18px; text-align: center; }
    .board-tag { display: inline-block; font-size: 0.75rem; font-weight: 700; color: #10b981; background: rgba(16, 185, 129, 0.15); padding: 4px 12px; border-radius: 20px; margin-bottom: 6px; }
    .call-num { font-size: 3.4rem; font-weight: 900; color: #ff7828; line-height: 1.1; margin: 4px 0; }
    .call-name { font-size: 1.15rem; font-weight: 800; color: #ffffff; min-height: 1.4rem; }
    .call-opt { font-size: 0.9rem; color: #fde047; font-weight: 700; margin-top: 4px; }

    /* 카드 공통 */
    .card { background: #1c2035; border: 1px solid #2e3553; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .card-title { font-size: 1.05rem; font-weight: 800; color: #ffffff; }

    /* 손님 폼 */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: #9ca3af; }
    .form-group input { background: #121422; border: 1px solid #2e3553; border-radius: 12px; padding: 13px; font-size: 1rem; color: #ffffff; outline: none; }
    .form-group input:focus { border-color: #ff7828; }
    
    .option-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .option-item { background: #121422; border: 1px solid #2e3553; border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; transition: 0.2s; }
    .option-item .cnt { font-size: 0.95rem; font-weight: 800; color: #ffffff; }
    .option-item .prc { font-size: 0.8rem; font-weight: 700; color: #9ca3af; margin-top: 4px; }
    .option-item.active { border-color: #ff7828; background: rgba(255, 120, 40, 0.15); }
    .option-item.active .cnt { color: #ff7828; }
    .option-item.active .prc { color: #fde047; }

    .btn-main { background: #10b981; color: #ffffff; border: none; border-radius: 12px; padding: 16px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    .btn-main:active { filter: brightness(0.9); }

    /* 관리자 전용 제어부 */
    .admin-current-info {
      background: #121422;
      border: 1px solid #2e3553;
      border-radius: 12px;
      padding: 12px 14px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fde047;
    }
    .admin-controls { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
    .btn-call { background: #ff7828; color: #ffffff; border: none; border-radius: 12px; padding: 15px; font-size: 1.05rem; font-weight: 800; cursor: pointer; }
    .btn-call:active { filter: brightness(0.9); }
    .btn-finish { background: #2e3553; color: #e5e7eb; border: none; border-radius: 12px; padding: 15px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    .btn-finish:active { filter: brightness(0.9); }
    .btn-reset-all { background: #374151; color: #f87171; border: none; border-radius: 10px; padding: 12px; font-size: 0.85rem; font-weight: 700; cursor: pointer; margin-top: 8px; }

    /* 관리자 공지/메모 에디터 */
    .quick-preset-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
    .preset-btn { background: #121422; border: 1px solid #2e3553; color: #d1d5db; border-radius: 8px; padding: 6px 10px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .preset-btn:active { background: #2b324b; }
    .notice-toggle-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .btn-notice-on { background: #ff7828; color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 800; cursor: pointer; }
    .btn-notice-off { background: #2e3553; color: #9ca3af; border: none; padding: 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer; }

    /* 대기 리스트 */
    .queue-box { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
    .queue-row { display: flex; justify-content: space-between; align-items: center; background: #121422; border: 1px solid #2e3553; border-radius: 10px; padding: 12px 14px; }
    .q-left { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; }
    .q-badge { font-size: 1.15rem; font-weight: 900; color: #ff7828; }
    .q-name { font-weight: 700; color: #ffffff; }
    .q-opt { font-size: 0.8rem; color: #fde047; font-weight: 600; }
    .btn-del { background: #374151; color: #ef4444; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }

    /* 토스트 알림 */
    .toast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ff7828; color: #fff; padding: 14px 24px; border-radius: 30px; font-weight: 800; font-size: 1rem; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 1000; text-align: center; }
  </style>
</head>
<body>
<div class="container">

  <!-- 헤더 -->
  <header class="header">
    <div class="title" id="pageTitle">🎃 할로윈 타투스티커 부스</div>
    <button type="button" class="mode-switch-btn" id="modeBtn" onclick="switchViewMode()">⚙️ 관리자 모드</button>
  </header>

  <!-- 휴식 및 안내 공지 배너 -->
  <div id="noticeBanner" class="notice-banner"></div>

  <!-- 1. 상단: 현재 진행 현황 전광판 (손님/관리자 공통) -->
  <section class="board">
    <div class="board-tag" id="statusBadge">지금 진행 중!</div>
    <div class="call-num" id="liveNum">0번</div>
    <div class="call-name" id="liveName">부스 준비 중</div>
    <div class="call-opt" id="liveOpt"></div>
  </section>

  <!-- ==================== 손님 화면 ==================== -->
  <div id="guestView" style="display: flex; flex-direction: column; gap: 14px;">
    <div class="card">
      <div class="card-title">⚡ 줄서기 번호표 등록</div>
      <div class="form-group">
        <label>원하는 닉네임 (또는 이름)</label>
        <input type="text" id="custName" placeholder="예: 호박마녀, 수아, 번개맨" maxlength="10" />
      </div>
      <div class="form-group">
        <label>타투스티커 수량 선택 (스티커는 현장에서 골라요!)</label>
        <div class="option-grid">
          <div class="option-item active" onclick="pickOption(this, '타투스티커 1장', '1,000원')">
            <div class="cnt">타투 1장</div>
            <div class="prc">1,000원</div>
          </div>
          <div class="option-item" onclick="pickOption(this, '타투스티커 2장', '2,000원')">
            <div class="cnt">타투 2장</div>
            <div class="prc">2,000원</div>
          </div>
          <div class="option-item" onclick="pickOption(this, '타투스티커 3장', '3,000원')">
            <div class="cnt">타투 3장</div>
            <div class="prc">3,000원</div>
          </div>
        </div>
      </div>
      <button type="button" class="btn-main" onclick="registerQueue()">번호표 등록하기</button>
    </div>

    <!-- 대기 명단 -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="card-title">실시간 대기 명단</span>
        <span style="color: #ff7828; font-weight: 800; font-size: 0.95rem;" id="guestWaitCountText">대기 0명 (약 0분)</span>
      </div>
      <div class="queue-box" id="guestQueueList">
        <div style="text-align: center; color: #9ca3af; font-size: 0.85rem; padding: 20px 0;">대기 중인 사람이 없습니다.</div>
      </div>
    </div>
  </div>

  <!-- ==================== 관리자 화면 ==================== -->
  <div id="adminView" style="display: none; flex-direction: column; gap: 14px;">
    <!-- 관리자 호출 컨트롤러 -->
    <div class="card">
      <div class="card-title">📢 손님 호출 컨트롤</div>
      <!-- 관리자 모드 전용 현재 손님 확인 바 -->
      <div class="admin-current-info" id="adminCurrentInfo">현재 대기 중 (호출 대기)</div>
      <div class="admin-controls">
        <button type="button" class="btn-call" onclick="callNextDirect()">📢 다음 손님 호출하기</button>
        <button type="button" class="btn-finish" onclick="finishCurrentDirect()">완료</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📝 부스 공지 및 휴식시간 설정</div>
      <div class="quick-preset-row">
        <button type="button" class="preset-btn" onclick="setPresetMemo('☕ 30분간 잠시 쉬어갑니다! (대기 등록은 가능)')">☕ 30분 휴식</button>
        <button type="button" class="preset-btn" onclick="setPresetMemo('🍙 점심시간입니다! (13:30부터 순번대로 시작)')">🍙 식사 시간</button>
        <button type="button" class="preset-btn" onclick="setPresetMemo('🎨 스티커 물품 재정비 중입니다. 잠시만 기다려주세요!')">🎨 재정비 중</button>
      </div>
      <div class="form-group">
        <input type="text" id="noticeInput" placeholder="손님 화면에 띄울 안내 메모를 적어주세요" maxlength="40" />
      </div>
      <div class="notice-toggle-btns">
        <button type="button" class="btn-notice-on" onclick="enableNotice()">📢 공지 띄우기</button>
        <button type="button" class="btn-notice-off" onclick="disableNotice()">공지 끄기</button>
      </div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="card-title">대기열 실시간 관리</span>
        <span style="color: #ff7828; font-weight: 800; font-size: 0.95rem;" id="adminWaitCountText">총 0명</span>
      </div>
      <div class="queue-box" id="adminQueueList">
        <div style="text-align: center; color: #9ca3af; font-size: 0.85rem; padding: 20px 0;">대기 중인 사람이 없습니다.</div>
      </div>
      <button type="button" class="btn-reset-all" onclick="resetQueue()">⚠️ 전체 대기열 초기화 (부스 마감)</button>
    </div>
  </div>

</div>

<div id="toastBox" class="toast"></div>

<script>
  var ADMIN_PIN = "0000";
  var currentView = sessionStorage.getItem("hal_view_mode") || "guest";
  var lastRenderedJson = "";

  var appData = {
    currentNum: 0,
    currentName: "부스 준비 중",
    currentOpt: "",
    lastNum: 0,
    list: [],
    noticeText: "",
    isNoticeActive: false
  };

  var curOpt = { count: "타투스티커 1장", price: "1,000원" };

  function loadData() {
    try {
      var saved = localStorage.getItem("hal_tab_data");
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed && typeof parsed.lastNum === "number") {
          appData = parsed;
          if (appData.noticeText === undefined) appData.noticeText = "";
          if (appData.isNoticeActive === undefined) appData.isNoticeActive = false;
        }
      }
    } catch (e) {}
  }

  function saveData() {
    try {
      localStorage.setItem("hal_tab_data", JSON.stringify(appData));
    } catch (e) {}
  }

  function applyViewMode() {
    if (currentView === "admin") {
      document.getElementById("modeBtn").innerText = "👤 손님 화면으로";
      document.getElementById("modeBtn").className = "mode-switch-btn admin-on";
      document.getElementById("pageTitle").innerText = "🛠️ 부스 관리자 모드";
      document.getElementById("guestView").style.display = "none";
      document.getElementById("adminView").style.display = "flex";
      if (document.getElementById("noticeInput")) {
        document.getElementById("noticeInput").value = appData.noticeText || "";
      }
    } else {
      document.getElementById("modeBtn").innerText = "⚙️ 관리자 모드";
      document.getElementById("modeBtn").className = "mode-switch-btn";
      document.getElementById("pageTitle").innerText = "🎃 할로윈 타투스티커 부스";
      document.getElementById("guestView").style.display = "flex";
      document.getElementById("adminView").style.display = "none";
    }
  }

  function switchViewMode() {
    if (currentView === "admin") {
      currentView = "guest";
      sessionStorage.setItem("hal_view_mode", "guest");
      applyViewMode();
    } else {
      var pin = prompt("관리자 비밀번호를 입력하세요 (기본: 0000):");
      if (pin === ADMIN_PIN) {
        currentView = "admin";
        sessionStorage.setItem("hal_view_mode", "admin");
        applyViewMode();
      } else if (pin !== null) {
        alert("비밀번호가 일치하지 않습니다.");
      }
    }
    render(true);
  }

  function setPresetMemo(text) {
    document.getElementById("noticeInput").value = text;
  }

  function enableNotice() {
    var val = document.getElementById("noticeInput").value.trim();
    if (!val) {
      alert("안내할 공지 문구를 입력해 주세요.");
      return;
    }
    appData.noticeText = val;
    appData.isNoticeActive = true;
    saveData();
    render(true);
    showToast("📢 공지가 화면에 등록되었습니다!");
  }

  function disableNotice() {
    appData.isNoticeActive = false;
    saveData();
    render(true);
    showToast("공지 배너를 내렸습니다.");
  }

  function pickOption(el, count, price) {
    var items = document.querySelectorAll(".option-item");
    for (var i = 0; i < items.length; i++) {
      items[i].className = "option-item";
    }
    el.className = "option-item active";
    curOpt = { count: count, price: price };
  }

  function registerQueue() {
    var input = document.getElementById("custName");
    var name = input.value.trim();
    if (!name) {
      name = "귀요미" + (appData.lastNum + 1);
    }

    appData.lastNum += 1;
    var optStr = curOpt.count + " (" + curOpt.price + ")";
    var item = {
      num: appData.lastNum,
      name: name,
      opt: optStr
    };

    appData.list.push(item);
    input.value = "";
    saveData();
    render(true);

    showToast("🎉 #" + item.num + "번 " + item.name + " 님 접수 완료! (대기 " + appData.list.length + "번째)");
    playChime(600, 0.15);
  }

  function callNextDirect() {
    if (appData.list.length === 0) {
      alert("대기 중인 다음 손님이 없습니다.");
      return;
    }
    var next = appData.list.shift();
    appData.currentNum = next.num;
    appData.currentName = next.name;
    appData.currentOpt = next.opt;
    saveData();
    render(true);
    playChime(880, 0.3);
  }

  function finishCurrentDirect() {
    if (appData.currentNum === 0) {
      alert("현재 진행 중인 손님이 없습니다.");
      return;
    }
    appData.currentNum = 0;
    appData.currentName = "부스 준비 중";
    appData.currentOpt = "";
    saveData();
    render(true);
  }

  function delOne(num) {
    if (!confirm("#" + num + "번 대기자를 취소하시겠습니까?")) return;
    appData.list = appData.list.filter(function(i) { return i.num !== num; });
    saveData();
    render(true);
  }

  function resetQueue() {
    if (!confirm("전체 번호표와 대기열을 완전히 초기화하시겠습니까?")) return;
    appData = {
      currentNum: 0,
      currentName: "부스 준비 중",
      currentOpt: "",
      lastNum: 0,
      list: [],
      noticeText: "",
      isNoticeActive: false
    };
    saveData();
    render(true);
  }

  function showToast(msg) {
    var toast = document.getElementById("toastBox");
    toast.innerText = msg;
    toast.style.display = "block";
    setTimeout(function() {
      toast.style.display = "none";
    }, 2800);
  }

  function playChime(freq, dur) {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    } catch(e){}
  }

  function render(force) {
    var currentJson = JSON.stringify(appData);
    if (!force && currentJson === lastRenderedJson) {
      return;
    }
    lastRenderedJson = currentJson;

    // 0. 공지 배너
    var banner = document.getElementById("noticeBanner");
    if (appData.isNoticeActive && appData.noticeText) {
      banner.innerText = appData.noticeText;
      banner.style.display = "block";
    } else {
      banner.style.display = "none";
    }

    // 1. 공통 상단 전광판 (어린이 제거 -> 닉네임 + 님)
    var badge = document.getElementById("statusBadge");
    var liveNum = document.getElementById("liveNum");
    var liveName = document.getElementById("liveName");
    var liveOpt = document.getElementById("liveOpt");
    var adminCurrentInfo = document.getElementById("adminCurrentInfo");

    if (appData.currentNum > 0) {
      badge.innerText = "현재 진행 중 🎨";
      badge.style.background = "rgba(255, 120, 40, 0.2)";
      badge.style.color = "#ff7828";
      liveNum.innerText = "#" + appData.currentNum + "번";
      liveName.innerText = appData.currentName + " 님";
      liveOpt.innerText = "[" + appData.currentOpt + "]";

      // 관리자 화면 내부 상태창
      if (adminCurrentInfo) {
        adminCurrentInfo.innerHTML = "👉 진행 중: <strong>#" + appData.currentNum + "번 " + appData.currentName + " 님</strong> [" + appData.currentOpt + "]";
      }
    } else {
      badge.innerText = "부스 대기 중 💤";
      badge.style.background = "rgba(16, 185, 129, 0.15)";
      badge.style.color = "#10b981";
      liveNum.innerText = "-";
      liveName.innerText = "다음 손님을 호출해 주세요";
      liveOpt.innerText = "";

      if (adminCurrentInfo) {
        adminCurrentInfo.innerText = "현재 대기 중 (호출 버튼을 눌러주세요)";
      }
    }

    var waitCount = appData.list.length;

    // 2. 손님 화면 대기 리스트
    document.getElementById("guestWaitCountText").innerText = "대기 " + waitCount + "명 (약 " + (waitCount * 3) + "분)";
    var guestList = document.getElementById("guestQueueList");
    if (waitCount === 0) {
      guestList.innerHTML = '<div style="text-align: center; color: #9ca3af; font-size: 0.85rem; padding: 20px 0;">대기 중인 사람이 없습니다.</div>';
    } else {
      var gHtml = "";
      for (var i = 0; i < waitCount; i++) {
        var row = appData.list[i];
        gHtml += '<div class="queue-row">' +
                   '<div class="q-left">' +
                     '<span class="q-badge">#' + row.num + '</span>' +
                     '<span class="q-name">' + row.name + '</span>' +
                     '<span class="q-opt">[' + row.opt + ']</span>' +
                   '</div>' +
                   '<div style="font-size: 0.8rem; color: #9ca3af; font-weight: 700;">' + (i + 1) + '번째</div>' +
                 '</div>';
      }
      guestList.innerHTML = gHtml;
    }

    // 3. 관리자 화면 대기 리스트
    document.getElementById("adminWaitCountText").innerText = "총 " + waitCount + "명";
    var adminList = document.getElementById("adminQueueList");
    if (waitCount === 0) {
      adminList.innerHTML = '<div style="text-align: center; color: #9ca3af; font-size: 0.85rem; padding: 20px 0;">대기 중인 사람이 없습니다.</div>';
    } else {
      var aHtml = "";
      for (var j = 0; j < waitCount; j++) {
        var item = appData.list[j];
        aHtml += '<div class="queue-row">' +
                   '<div class="q-left">' +
                     '<span class="q-badge">#' + item.num + '</span>' +
                     '<span class="q-name">' + item.name + '</span>' +
                     '<span class="q-opt">[' + item.opt + ']</span>' +
                   '</div>' +
                   '<div>' +
                     '<button type="button" class="btn-del" onclick="delOne(' + item.num + ')">취소</button>' +
                   '</div>' +
                 '</div>';
      }
      adminList.innerHTML = aHtml;
    }
  }

  window.addEventListener('storage', function() {
    loadData();
    render(false);
  });

  loadData();
  applyViewMode();
  render(true);
</script>
</body>
</html>
