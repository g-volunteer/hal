<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>할로윈 타투 부스 실시간 웨이팅</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f111a;
      --card-bg: #1a1d2e;
      --orange: #ff7828;
      --orange-glow: rgba(255, 120, 40, 0.35);
      --purple: #8b5cf6;
      --green: #10b981;
      --red: #ef4444;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2e344e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 40px; }

    /* 모드 전환 탭 */
    .header-nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .brand { font-size: 1.25rem; font-weight: 800; color: var(--orange); display: flex; align-items: center; gap: 6px; }
    .role-toggle { display: flex; background: var(--card-bg); border-radius: 999px; padding: 3px; border: 1px solid var(--border); }
    .role-btn { border: none; background: none; color: var(--text-muted); font-size: 0.8rem; font-weight: 700; padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: 0.2s; }
    .role-btn.active { background: var(--orange); color: #fff; }

    /* 실시간 전광판 */
    .status-board {
      background: linear-gradient(145deg, #1f2337, #151827);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--green);
      background: rgba(16, 185, 129, 0.12);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .live-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

    .calling-box { margin: 10px 0; }
    .calling-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .calling-num { font-size: 3.5rem; font-weight: 900; color: var(--orange); letter-spacing: -1px; text-shadow: 0 0 20px var(--orange-glow); line-height: 1.1; }
    .calling-name { font-size: 1.1rem; font-weight: 700; color: #fff; margin-top: 4px; }
    .stats-row { display: flex; justify-content: space-around; border-top: 1px dashed var(--border); padding-top: 14px; margin-top: 14px; }
    .stat-item .val { font-size: 1.3rem; font-weight: 800; color: #fff; }
    .stat-item .lbl { font-size: 0.75rem; color: var(--text-muted); }

    /* 대기 완료 카드 */
    .my-ticket-card {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(255, 120, 40, 0.15));
      border: 1px solid var(--purple);
      border-radius: 20px;
      padding: 22px;
      text-align: center;
    }
    .ticket-head { font-size: 0.85rem; color: #d8b4fe; font-weight: 700; margin-bottom: 4px; }
    .ticket-num { font-size: 3.2rem; font-weight: 900; color: #fff; line-height: 1; margin: 8px 0; }
    .ticket-option-info { font-size: 0.95rem; color: #fde047; font-weight: 700; margin-bottom: 8px; }
    .waiting-ahead { font-size: 1.1rem; color: var(--orange); font-weight: 800; margin-bottom: 12px; }
    .ticket-alert-box { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 12px; font-size: 0.85rem; line-height: 1.5; color: #e5e7eb; }
    .ticket-alert-box.ready { background: var(--orange); color: #fff; font-weight: 700; animation: shake 0.6s infinite alternate; }
    @keyframes shake { 0% { transform: scale(1); } 100% { transform: scale(1.03); } }

    .form-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20
