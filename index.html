<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>할로윈 타투 부스 웨이팅</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background-color: #121420; color: #f3f4f6; display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; padding-bottom: 30px; }

    /* 헤더 */
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2b324b; padding-bottom: 12px; }
    .title { font-size: 1.15rem; font-weight: 800; color: #ff7828; }
    .mode-box { display: flex; background: #1e2238; border-radius: 20px; padding: 3px; }
    .mode-btn { border: none; background: transparent; color: #9ca3af; font-size: 0.8rem; font-weight: 700; padding: 6px 14px; border-radius: 16px; cursor: pointer; }
    .mode-btn.active { background: #ff7828; color: #ffffff; }

    /* 전광판 */
    .board { background: #1c2035; border: 1px solid #2e3553; border-radius: 18px; padding: 18px; text-align: center; }
    .board-tag { display: inline-block; font-size: 0.75rem; font-weight: 700; color: #10b981; background: rgba(16, 185, 129, 0.15); padding: 4px 10px; border-radius: 20px; margin-bottom: 8px; }
    .call-num { font-size: 3.2rem; font-weight: 900; color: #ff7828; line-height: 1.1; margin: 4px 0; }
    .call-name { font-size: 1.05rem; font-weight: 700; color: #ffffff; min-height: 1.3rem; }
    .board-stats { display: flex; justify-content: space-around; border-top: 1px dashed #2e3553; padding-top: 12px; margin-top: 12px; }
    .stat-val { font-size: 1.25rem; font-weight: 800; color: #ffffff; }
    .stat-lbl { font-size: 0.75rem; color: #9ca3af; margin-top: 2px; }

    /* 카드 공통 */
    .card { background: #1c2035; border: 1px solid #2e3553; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .card-title { font-size: 1rem; font-weight: 800; color: #ffffff; }

    /* 입력폼 */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.8rem; font-weight: 700; color: #9ca3af; }
    .form-group input { background: #121422; border: 1px solid #2e3553; border-radius: 10px; padding: 12px; font-size: 1rem; color: #ffffff; outline: none; }
    
    /* 금액/수량 선택 */
    .option-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .option-item { background: #121422; border: 1px solid #2e3553; border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; }
    .option-item .cnt { font-size: 0.9rem; font-weight: 800; color: #ffffff; }
    .option-item .prc { font-size: 0.75rem; font-weight: 700; color: #9ca3af; margin-top: 4px; }
    .option-item.active { border-color: #ff7828; background: rgba(255, 120, 40, 0.15); }
    .option-item.active .cnt { color: #ff7828; }
    .option-item.active .prc { color: #fde047; }

    .btn-main { background: #ff7828; color: #ffffff; border: none; border-radius: 12px; padding: 15px; font-size: 1.05rem; font-weight: 800; cursor: pointer; }
    .btn-main:active { filter: brightness(0.9); }

    /* 내 번호표 카드 */
    .ticket-card { background: #25203b; border: 1px solid #8b5cf6; border-radius: 18px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
    .my-num { font-size: 3rem; font-weight: 900; color: #ffffff; line-height: 1; }
    .my-choice { font-size: 0.95rem; font-weight: 700; color: #fde047; }
    .my-wait { font-size: 1.15rem; font-weight: 800; color: #ff7828; }
    .my-msg { background: rgba(0, 0, 0, 0.35); border-radius: 10px; padding: 12px; font-size: 0.85rem; line-height: 1.4; color: #e5e7eb; }
    .my-msg.ready { background: #ff7828; color: #ffffff; font-weight: 800; }
    .btn-cancel { background: transparent; border: none; color: #9ca3af; font-size: 0.8rem; text-decoration: underline; cursor: pointer; margin-top: 6px; }

    /* 관리자 패널 */
    .admin-btns { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
    .btn-call { background: #ff7828; color: #ffffff; border: none; border-radius: 12px; padding: 14px; font-size: 1rem; font-weight: 800; cursor: pointer; }
    .btn-reset { background: #2e3553; color: #9ca3af; border: none; border-radius: 12px; padding: 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
    .queue-box { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; }
    .queue-row { display: flex; justify-content: space-between; align-items: center; background: #121422; border: 1px solid #2e3553; border-radius: 10px; padding: 10px 12px; }
    .q-left { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .q-badge { font-size: 1.1rem; font-weight: 900; color: #ff7828; }
    .q-name { font-weight: 700; color: #ffffff; }
    .q-opt { font-size: 0.75rem; color: #fde047; font-weight: 600; }
    .q-acts button { border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .btn-q-call { background: #10b981; color: #ffffff; }
    .btn-q-del { background: #374151; color: #9ca3af; margin-left: 4px; }
  </style>
</head>
<body>
<div class="container">

  <!-- 상단 모드 전환 -->
  <header class="header">
    <div class="title">🎃 타투부스 웨이팅</div>
    <div class="mode-box">
      <button type="button" class="mode-btn active" id="btnGuest" onclick="changeMode('guest')">손님용</button>
      <button type="button" class="mode-btn" id="btnAdmin" onclick="changeMode('admin')">관리자</button>
    </div>
  </header>

  <!-- 실시간 전광판 -->
  <section class="board">
    <div class="board-tag">부스 운영 현황</div>
    <div class="call-num" id="liveNum">0번</div>
    <div class="call-name" id="liveName">부스 준비 중</div>
    <div class="board-stats">
      <div>
        <div class="stat-val" id="waitCount">0명</div>
        <div class="stat-lbl">현재 대기 팀</div>
      </div>
      <div>
        <div class="stat-val" id="waitTime">0분</div>
        <div class="stat-lbl">예상 소요 시간</div>
      </div>
    </div>
  </section>

  <!-- 1. 손님 신청 폼 -->
  <div id="sectionForm" class="card">
    <div class="card-title">⚡ 줄서기 등록</div>
    <div class="form-group">
      <label>아이 이름 (또는 별명)</label>
      <input type="text" id="custName" placeholder="예: 수아" maxlength="8" />
    </div>
    <div class="form-group">
      <label>타투 수량 선택 (스티커는 현장에서 골라요!)</label>
      <div class="option-grid">
        <div class="option-item active" onclick="pickOption(this, '타투 1장', '1,000원')">
          <div class="cnt">타투 1장</div>
          <div class="prc">1,000원</div>
        </div>
        <div class="option-item" onclick="pickOption(this, '타투 2장', '2,000원')">
          <div class="cnt">타투 2장</div>
          <div class="prc">2,000원</div>
        </div>
        <div class="option-item" onclick="pickOption(this, '타투 3장', '3,000원')">
          <div class="cnt">타투 3장</div>
          <div class="prc">3,000원</div>
        </div>
      </div>
    </div>
    <button type="button" class="btn-main" onclick="registerQueue()">번호표 발급받기</button>
  </div>

  <!-- 2. 손님 발급 티켓 -->
  <div id="sectionTicket" class="ticket-card" style="display: none;">
    <div style="font-size: 0.8rem; color: #c4b5fd; font-weight: 700;">내 접수 번호</div>
    <div class="my-num" id="myNumText">#0</div>
    <div class="my-choice" id="myChoiceText">타투 1장 (1,000원)</div>
    <div class="my-wait" id="myWaitText">대기 중</div>
    <div class="my-msg" id="myMsgBox">잠시만 기다려주세요.</div>
    <button type="button" class="btn-cancel" onclick="cancelQueue()">대기 취소하기</button>
  </div>

  <!-- 3. 관리자 패널 -->
  <div id="sectionAdmin" class="card" style="display: none;">
    <div class="admin-btns">
      <button type="button" class="btn-call" onclick="callNext()">📢 다음 번호 호출</button>
      <button type="button" class="btn-reset" onclick="resetQueue()">초기화</button>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 700; color: #ffffff;">
      <span>대기 목록</span>
      <span style="color: #ff7828;" id="adminCountText">0명</span>
    </div>
    <div class="queue-box" id="adminList">
      <div style="text-align: center; color: #9ca3af; font-size: 0.85rem; padding: 20px 0;">대기 중인 사람이 없습니다.</div>
    </div>
  </div>

</div>

<script>
  var appData = {
    currentNum: 0,
    currentName: "부스 준비 중",
    currentOpt: "",
    lastNum: 0,
    list: []
  };

  var curOpt = { count: "타투 1장", price: "1,000원" };
  var myNum = null;
  var currentMode = "guest";

  function loadData() {
    try {
      var saved = localStorage.getItem("hal_app_data");
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed && typeof parsed.lastNum === "number") {
          appData = parsed;
        }
      }
      var savedNum = localStorage.getItem("hal_my_num");
      if (savedNum) {
        myNum = parseInt(savedNum, 10);
      }
    } catch (e) {}
  }

  function saveData() {
    try {
      localStorage.setItem("hal_app_data", JSON.stringify(appData));
    } catch (e) {}
  }

  function changeMode(mode) {
    currentMode = mode;
    document.getElementById("btnGuest").className = mode === "guest" ? "mode-btn active" : "mode-btn";
    document.getElementById("btnAdmin").className = mode === "admin" ? "mode-btn active" : "mode-btn";
    render();
  }

  function pickOption(el, count, price) {
    var items = document.querySelectorAll(".option-item");
    for (var i = 0; i < items.length; i++) {
      items[i].className = "option-item";
    }
    el.className = "option-item active";
    curOpt = { count: count, price: price };
  }

  function registerQueue() {
    var input = document.getElementById("custName");
    var name = input.value.trim();
    if (!name) {
      name = "아이" + (appData.lastNum + 1);
    }

    appData.lastNum += 1;
    var optStr = curOpt.count + " (" + curOpt.price + ")";
    var item = {
      num: appData.lastNum,
      name: name,
      opt: optStr
    };

    appData.list.push(item);
    myNum = item.num;

    try {
      localStorage.setItem("hal_my_num", myNum);
      localStorage.setItem("hal_my_opt", optStr);
    } catch (e) {}

    input.value = "";
    saveData();
    render();
  }

  function cancelQueue() {
    if (!confirm("대기를 취소하시겠습니까?")) return;
    appData.list = appData.list.filter(function(i) { return i.num !== myNum; });
    myNum = null;
    try {
      localStorage.removeItem("hal_my_num");
      localStorage.removeItem("hal_my_opt");
    } catch (e) {}
    saveData();
    render();
  }

  function callNext() {
    if (appData.list.length === 0) {
      alert("대기자가 없습니다.");
      return;
    }
    var next = appData.list.shift();
    appData.currentNum = next.num;
    appData.currentName = next.name;
    appData.currentOpt = next.opt;
    saveData();
    render();
  }

  function callOne(num) {
    var idx = -1;
    for (var i = 0; i < appData.list.length; i++) {
      if (appData.list[i].num === num) {
        idx = i;
        break;
      }
    }
    if (idx !== -1) {
      var item = appData.list.splice(idx, 1)[0];
      appData.currentNum = item.num;
      appData.currentName = item.name;
      appData.currentOpt = item.opt;
      saveData();
      render();
    }
  }

  function delOne(num) {
    appData.list = appData.list.filter(function(i) { return i.num !== num; });
    saveData();
    render();
  }

  function resetQueue() {
    if (!confirm("모든 데이터를 초기화하시겠습니까?")) return;
    appData = {
      currentNum: 0,
      currentName: "부스 준비 중",
      currentOpt: "",
      lastNum: 0,
      list: []
    };
    saveData();
    render();
  }

  function render() {
    // 1. 공통 전광판
    document.getElementById("liveNum").innerText = appData.currentNum + "번";
    var optText = appData.currentOpt ? " [" + appData.currentOpt + "]" : "";
    document.getElementById("liveName").innerText = appData.currentName + optText;
    document.getElementById("waitCount").innerText = appData.list.length + "명";
    document.getElementById("waitTime").innerText = (appData.list.length * 3) + "분";

    // 2. 관리자 뷰
    if (currentMode === "admin") {
      document.getElementById("sectionForm").style.display = "none";
      document.getElementById("sectionTicket").style.display = "none";
      document.getElementById("sectionAdmin").style.display = "flex";

      document.getElementById("adminCountText").innerText = appData.list.length + "명";
      var adminList = document.getElementById("adminList");
      if (appData.list.length === 0) {
        adminList.innerHTML = '<div style="text-align: center; color: #9ca3af; font-size: 0.85rem; padding: 20px 0;">대기 중인 사람이 없습니다.</div>';
      } else {
        var html = "";
        for (var i = 0; i < appData.list.length; i++) {
          var row = appData.list[i];
          html += '<div class="queue-row">' +
                    '<div class="q-left">' +
                      '<span class="q-badge">#' + row.num + '</span>' +
                      '<span class="q-name">' + row.name + '</span>' +
                      '<span class="q-opt">[' + row.opt + ']</span>' +
                    '</div>' +
                    '<div class="q-acts">' +
                      '<button type="button" class="btn-q-call" onclick="callOne(' + row.num + ')">호출</button>' +
                      '<button type="button" class="btn-q-del" onclick="delOne(' + row.num + ')">취소</button>' +
                    '</div>' +
                  '</div>';
        }
        adminList.innerHTML = html;
      }
      return;
    }

    // 3. 손님 뷰
    document.getElementById("sectionAdmin").style.display = "none";
    if (myNum === null) {
      document.getElementById("sectionForm").style.display = "flex";
      document.getElementById("sectionTicket").style.display = "none";
    } else {
      document.getElementById("sectionForm").style.display = "none";
      document.getElementById("sectionTicket").style.display = "flex";

      document.getElementById("myNumText").innerText = "#" + myNum;
      var savedOpt = localStorage.getItem("hal_my_opt") || "선택 완료";
      document.getElementById("myChoiceText").innerText = savedOpt;

      var ahead = -1;
      for (var j = 0; j < appData.list.length; j++) {
        if (appData.list[j].num === myNum) {
          ahead = j;
          break;
        }
      }

      var msgBox = document.getElementById("myMsgBox");
      var waitText = document.getElementById("myWaitText");

      if (appData.currentNum === myNum) {
        waitText.innerText = "🎉 지금 바로 입장하세요!";
        msgBox.className = "my-msg ready";
        msgBox.innerHTML = "내 차례가 되었습니다!<br>부스로 와서 스티커 고르고 예쁘게 붙여요!";
      } else if (ahead !== -1) {
        waitText.innerText = "내 앞 대기: " + ahead + "명";
        msgBox.className = "my-msg";
        msgBox.innerHTML = ahead === 0
          ? "👉 <strong>다음 순서입니다!</strong> 부스 근처로 와주세요."
          : "에어바운서에서 신나게 놀고 계세요!<br>순서가 다가오면 화면에 바로 안내됩니다.";
      } else {
        waitText.innerText = "시술 완료 또는 취소";
        msgBox.className = "my-msg";
        msgBox.innerHTML = "타투 부스 이용이 완료되었습니다.";
      }
    }
  }

  loadData();
  render();
</script>
</body>
</html>
