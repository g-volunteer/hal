<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>🎃 할로윈 타투스티커</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #0e101a;
      color: #f3f4f6;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 8px 10px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 960px;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 헤더 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #23293f;
      padding-bottom: 4px;
      flex-shrink: 0;
    }
    .title { font-size: 1.1rem; font-weight: 800; color: #ff7828; }
    .header-right { display: flex; gap: 6px; align-items: center; }
    .header-btn {
      border: 1px solid #374151;
      background: #1e2238;
      color: #9ca3af;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .header-btn.admin-on { background: #ff7828; color: #ffffff; border-color: #ff7828; }
    .header-btn.settle-btn { background: #059669; color: #ffffff; border-color: #10b981; }

    /* 공지 배너 */
    .notice-banner {
      display: none;
      background: #ff5722;
      border: 2px solid #ffd54f;
      border-radius: 8px;
      padding: 6px 10px;
      text-align: center;
      color: #ffffff;
      font-weight: 900;
      font-size: 0.88rem;
      line-height: 1.3;
      box-shadow: 0 0 14px rgba(255, 87, 34, 0.6);
      flex-shrink: 0;
      animation: pulseNotice 2s infinite ease-in-out;
    }
    @keyframes pulseNotice {
      0%, 100% { box-shadow: 0 0 10px rgba(255, 87, 34, 0.5); }
      50% { box-shadow: 0 0 20px rgba(255, 213, 79, 0.9); }
    }

    /* 반응형 레이아웃 */
    .content-area {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      min-height: 0;
    }

    @media (orientation: landscape) and (min-height: 380px), (min-width: 680px) {
      .content-area {
        grid-template-columns: 1.1fr 0.9fr;
      }
    }

    .col-left, .col-right {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }

    /* 카드 공통 */
    .card {
      background: #171b2d;
      border: 1px solid #28304f;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-title { font-size: 0.88rem; font-weight: 800; color: #ffffff; }

    /* 전광판 */
    .board {
      background: #171b2d;
      border: 1px solid #28304f;
      border-radius: 12px;
      padding: 6px 10px;
      text-align: center;
      flex-shrink: 0;
    }
    .board-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 800;
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .call-num { font-size: 1.9rem; font-weight: 900; color: #ff7828; line-height: 1; margin: 2px 0; }
    .call-name { font-size: 0.92rem; font-weight: 800; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .call-opt { font-size: 0.75rem; color: #fde047; font-weight: 700; }

    .form-card {
      flex-shrink: 0 !important;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group { display: flex; flex-direction: column; gap: 3px; }
    .form-group label { font-size: 0.72rem; font-weight: 700; color: #9ca3af; }
    .form-group input {
      background: #0f121e;
      border: 1px solid #28304f;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.88rem;
      color: #ffffff;
      outline: none;
    }
    .form-group input:focus { border-color: #ff7828; }

    .option-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .option-item {
      background: #0f121e;
      border: 1px solid #28304f;
      border-radius: 8px;
      padding: 6px 2px;
      text-align: center;
      cursor: pointer;
    }
    .option-item .cnt { font-size: 0.82rem; font-weight: 800; color: #ffffff; }
    .option-item .prc { font-size: 0.7rem; font-weight: 700; color: #9ca3af; margin-top: 1px; }
    .option-item.active { border-color: #ff7828; background: rgba(255, 120, 40, 0.18); }
    .option-item.active .cnt { color: #ff7828; }
    .option-item.active .prc { color: #fde047; }

    .btn-main {
      background: #10b981;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-main:active { filter: brightness(0.9); }

    /* 대기 리스트 카드 */
    .queue-card-wrapper {
      flex: 1;
      min-height: 120px;
      display: flex;
      flex-direction: column;
    }
    .ticker-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .ticker-track {
      display: flex;
      flex-direction: column;
      gap: 5px;
      animation: tickerRoll 24s linear infinite;
    }
    .ticker-viewport:hover .ticker-track,
    .ticker-viewport:active .ticker-track {
      animation-play-state: paused;
    }
    @keyframes tickerRoll {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    .queue-box-static {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .queue-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f121e;
      border: 1px solid #28304f;
      border-radius: 8px;
      padding: 7px 10px;
      flex-shrink: 0;
    }
    .q-left { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
    .q-badge { font-size: 0.95rem; font-weight: 900; color: #ff7828; }
    .q-name { font-weight: 700; color: #ffffff; }
    .q-opt { font-size: 0.72rem; color: #fde047; font-weight: 600; }
    .btn-del { background: #374151; color: #ef4444; border: none; padding: 4px 8px; border-radius: 5px; font-size: 0.7rem; font-weight: 700; cursor: pointer; }

    /* 관리자 3단 컨트롤 (호출, 완료, 패스) */
    .admin-current-info {
      background: #0f121e;
      border: 1px solid #28304f;
      border-radius: 8px;
      padding: 6px 8px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: #fde047;
    }
    .admin-controls { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 6px; }
    .btn-call { background: #ff7828; color: #ffffff; border: none; border-radius: 8px; padding: 10px; font-size: 0.9rem; font-weight: 800; cursor: pointer; }
    .btn-finish { background: #059669; color: #ffffff; border: none; border-radius: 8px; padding: 10px; font-size: 0.85rem; font-weight: 800; cursor: pointer; }
    .btn-pass { background: #4b5563; color: #fca5a5; border: none; border-radius: 8px; padding: 10px; font-size: 0.85rem; font-weight: 800; cursor: pointer; }

    .quick-preset-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .preset-btn { background: #0f121e; border: 1px solid #28304f; color: #d1d5db; border-radius: 6px; padding: 4px 6px; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
    .notice-toggle-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-notice-on { background: #ff7828; color: #fff; border: none; padding: 7px; border-radius: 6px; font-size: 0.8rem; font-weight: 800; cursor: pointer; }
    .btn-notice-off { background: #28304f; color: #9ca3af; border: none; padding: 7px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .btn-reset-all { background: #374151; color: #f87171; border: none; border-radius: 6px; padding: 7px; font-size: 0.75rem; font-weight: 700; cursor: pointer; margin-top: 4px; }

    /* 토스트 알림 */
    .toast {
      display: none;
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff7828;
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      z-index: 1000;
      text-align: center;
      white-space: nowrap;
    }

    /* 정산 모달 팝업 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-box {
      background: #171b2d;
      border: 1px solid #28304f;
      border-radius: 14px;
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #28304f; padding-bottom: 8px; }
    .modal-title { font-size: 1.1rem; font-weight: 800; color: #10b981; }
    .modal-close { background: transparent; border: none; color: #9ca3af; font-size: 1.2rem; cursor: pointer; font-weight: 800; }
    .settle-summary {
      background: #0f121e;
      border: 1px solid #28304f;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: center;
    }
    .settle-sum-amount { font-size: 1.8rem; font-weight: 900; color: #ffd54f; }
    .settle-sum-detail { font-size: 0.82rem; color: #9ca3af; display: flex; justify-content: space-around; border-top: 1px dashed #28304f; padding-top: 8px; margin-top: 4px; }
    .settle-sum-detail strong { color: #ffffff; }
    .settle-list-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 240px;
      padding-right: 2px;
    }
    .settle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f121e;
      border: 1px solid #28304f;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
    }
    .settle-row.pass-item { opacity: 0.55; text-decoration: line-through; }
  </style>
</head>
<body>
<div class="container">

  <!-- 헤더 -->
  <header class="header">
    <div class="title" id="pageTitle">🎃 할로윈 타투스티커</div>
    <div class="header-right">
      <button type="button" class="header-btn settle-btn" id="settleMenuBtn" style="display:none;" onclick="openSettleModal()">📊 정산 내역</button>
      <button type="button" class="header-btn" id="modeBtn" onclick="switchViewMode()">⚙️ 관리자 모드</button>
    </div>
  </header>

  <!-- 강조 공지 배너 -->
  <div id="noticeBanner" class="notice-banner"></div>

  <!-- ==================== 손님 화면 ==================== -->
  <div id="guestView" class="content-area">
    <div class="col-left">
      <section class="board">
        <div class="board-tag" id="statusBadge">지금 진행 중!</div>
        <div class="call-num" id="liveNum">0번</div>
        <div class="call-name" id="liveName">준비 중</div>
        <div class="call-opt" id="liveOpt"></div>
      </section>

      <div class="card form-card">
        <div class="form-group">
          <label>원하는 닉네임 (또는 이름)</label>
          <input type="text" id="custName" placeholder="예: 호박마녀, 수아, 번개맨" maxlength="10" />
        </div>
        <div class="form-group">
          <label>타투스티커 수량 선택</label>
          <div class="option-grid">
            <div class="option-item active" onclick="pickOption(this, '타투스티커 1장', 1000)">
              <div class="cnt">타투 1장</div>
              <div class="prc">1,000원</div>
            </div>
            <div class="option-item" onclick="pickOption(this, '타투스티커 2장', 2000)">
              <div class="cnt">타투 2장</div>
              <div class="prc">2,000원</div>
            </div>
            <div class="option-item" onclick="pickOption(this, '타투스티커 3장', 3000)">
              <div class="cnt">타투 3장</div>
              <div class="prc">3,000원</div>
            </div>
          </div>
        </div>
        <button type="button" class="btn-main" onclick="registerQueue()">번호표 등록하기</button>
      </div>
    </div>

    <div class="col-right">
      <div class="card queue-card-wrapper">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <span class="card-title">실시간 대기 명단</span>
          <span style="color: #ff7828; font-weight: 800; font-size: 0.82rem;" id="guestWaitCountText">대기 0명</span>
        </div>
        <div class="ticker-viewport" id="guestViewport">
          <div class="ticker-track" id="guestTickerTrack">
            <div style="text-align: center; color: #9ca3af; font-size: 0.8rem; padding: 25px 0;">대기 중인 사람이 없습니다.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 관리자 화면 ==================== -->
  <div id="adminView" class="content-area" style="display: none;">
    <div class="col-left">
      <section class="board">
        <div class="board-tag" id="adminStatusBadge">지금 진행 중!</div>
        <div class="call-num" id="adminLiveNum">0번</div>
        <div class="call-name" id="adminLiveName">준비 중</div>
        <div class="call-opt" id="adminLiveOpt"></div>
      </section>

      <!-- 관리자 3단 컨트롤: 호출, 완료, 패스 -->
      <div class="card form-card">
        <div class="admin-current-info" id="adminCurrentInfo">현재 대기 중 (호출 대기)</div>
        <div class="admin-controls">
          <button type="button" class="btn-call" onclick="callNextDirect()">📢 다음 호출</button>
          <button type="button" class="btn-finish" onclick="finishCurrentWithSettle(true)">완료</button>
          <button type="button" class="btn-pass" onclick="finishCurrentWithSettle(false)">패스</button>
        </div>
      </div>

      <div class="card form-card">
        <div class="quick-preset-row">
          <button type="button" class="preset-btn" onclick="setPresetMemo('☕ 30분간 잠시 쉬어갑니다! (대기 접수 가능)')">☕ 30분 휴식</button>
          <button type="button" class="preset-btn" onclick="setPresetMemo('🍙 점심시간입니다! (13:30부터 순번대로 시작)')">🍙 식사 시간</button>
          <button type="button" class="preset-btn" onclick="setPresetMemo('🎨 스티커 물품 재정비 중입니다!')">🎨 재정비</button>
        </div>
        <input type="text" id="noticeInput" placeholder="손님 화면 강조 공지 문구 입력" maxlength="40" style="background:#0f121e; border:1px solid #28304f; border-radius:6px; padding:6px 8px; font-size:0.8rem; color:#fff; outline:none;" />
        <div class="notice-toggle-btns">
          <button type="button" class="btn-notice-on" onclick="enableNotice()">📢 공지 띄우기</button>
          <button type="button" class="btn-notice-off" onclick="disableNotice()">공지 끄기</button>
        </div>
      </div>
    </div>

    <div class="col-right">
      <div class="card queue-card-wrapper">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <span class="card-title">대기열 실시간 관리</span>
          <span style="color: #ff7828; font-weight: 800; font-size: 0.82rem;" id="adminWaitCountText">총 0명</span>
        </div>
        <div class="queue-box-static" id="adminQueueList">
          <div style="text-align: center; color: #9ca3af; font-size: 0.8rem; padding: 25px 0;">대기 중인 사람이 없습니다.</div>
        </div>
        <button type="button" class="btn-reset-all" onclick="resetQueue()">⚠️ 전체 초기화</button>
      </div>
    </div>
  </div>

</div>

<!-- 정산 내역 모달 팝업 -->
<div id="settleModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">📊 정산 및 판매 실적</span>
      <button type="button" class="modal-close" onclick="closeSettleModal()">✕</button>
    </div>
    
    <div class="settle-summary">
      <div style="font-size: 0.75rem; color: #9ca3af; font-weight: 700;">총 판매 수익금</div>
      <div class="settle-sum-amount" id="settleTotalAmount">0원</div>
      <div class="settle-sum-detail">
        <div>완료: <strong id="settleCountDone">0건</strong></div>
        <div>판매수량: <strong id="settleTotalSheets">0장</strong></div>
        <div>패스(제외): <strong id="settleCountPass" style="color:#fca5a5;">0건</strong></div>
      </div>
    </div>

    <div style="font-size: 0.8rem; font-weight: 700; color: #ffffff;">상세 처리 목록</div>
    <div class="settle-list-box" id="settleListBox">
      <div style="text-align:center; color:#9ca3af; font-size:0.78rem; padding:20px 0;">완료된 내역이 없습니다.</div>
    </div>
  </div>
</div>

<div id="toastBox" class="toast"></div>

<script>
  var ADMIN_PIN = "0000";
  var currentView = sessionStorage.getItem("hal_view_mode") || "guest";
  var lastRenderedJson = "";

  var appData = {
    currentNum: 0,
    currentName: "준비 중",
    currentOpt: "",
    currentPrice: 0,
    currentSheets: 0,
    lastNum: 0,
    list: [],
    noticeText: "",
    isNoticeActive: false,
    settlement: [] // 정산 데이터 보관: { num, name, opt, price, sheets, status: 'DONE'|'PASS', time }
  };

  var curOpt = { count: "타투스티커 1장", price: 1000, sheets: 1 };

  function loadData() {
    try {
      var saved = localStorage.getItem("hal_tab_data");
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed && typeof parsed.lastNum === "number") {
          appData = parsed;
          if (appData.noticeText === undefined) appData.noticeText = "";
          if (appData.isNoticeActive === undefined) appData.isNoticeActive = false;
          if (!Array.isArray(appData.settlement)) appData.settlement = [];
        }
      }
    } catch (e) {}
  }

  function saveData() {
    try {
      localStorage.setItem("hal_tab_data", JSON.stringify(appData));
    } catch (e) {}
  }

  function applyViewMode() {
    if (currentView === "admin") {
      document.getElementById("modeBtn").innerText = "👤 손님 화면";
      document.getElementById("modeBtn").className = "header-btn admin-on";
      document.getElementById("settleMenuBtn").style.display = "block";
      document.getElementById("pageTitle").innerText = "🛠️ 관리자 모드";
      document.getElementById("guestView").style.display = "none";
      document.getElementById("adminView").style.display = "grid";
      if (document.getElementById("noticeInput")) {
        document.getElementById("noticeInput").value = appData.noticeText || "";
      }
    } else {
      document.getElementById("modeBtn").innerText = "⚙️ 관리자 모드";
      document.getElementById("modeBtn").className = "header-btn";
      document.getElementById("settleMenuBtn").style.display = "none";
      document.getElementById("pageTitle").innerText = "🎃 할로윈 타투스티커";
      document.getElementById("guestView").style.display = "grid";
      document.getElementById("adminView").style.display = "none";
    }
  }

  function switchViewMode() {
    if (currentView === "admin") {
      currentView = "guest";
      sessionStorage.setItem("hal_view_mode", "guest");
      applyViewMode();
    } else {
      var pin = prompt("관리자 비밀번호를 입력하세요 (기본: 0000):");
      if (pin === ADMIN_PIN) {
        currentView = "admin";
        sessionStorage.setItem("hal_view_mode", "admin");
        applyViewMode();
      } else if (pin !== null) {
        alert("비밀번호가 일치하지 않습니다.");
      }
    }
    render(true);
  }

  function pickOption(el, count, price) {
    var items = document.querySelectorAll(".option-item");
    for (var i = 0; i < items.length; i++) {
      items[i].className = "option-item";
    }
    el.className = "option-item active";
    var sheets = price / 1000;
    curOpt = { count: count, price: price, sheets: sheets };
  }

  function registerQueue() {
    var input = document.getElementById("custName");
    var name = input.value.trim();
    if (!name) {
      name = "귀요미" + (appData.lastNum + 1);
    }

    appData.lastNum += 1;
    var optStr = curOpt.count + " (" + curOpt.price.toLocaleString() + "원)";
    var item = {
      num: appData.lastNum,
      name: name,
      opt: optStr,
      price: curOpt.price,
      sheets: curOpt.sheets
    };

    appData.list.push(item);
    input.value = "";
    saveData();
    render(true);

    showToast("🎉 #" + item.num + "번 " + item.name + " 님 접수 완료!");
    playChime(600, 0.15);
  }

  function callNextDirect() {
    if (appData.list.length === 0) {
      alert("다음 손님이 없습니다.");
      return;
    }
    var next = appData.list.shift();
    appData.currentNum = next.num;
    appData.currentName = next.name;
    appData.currentOpt = next.opt;
    appData.currentPrice = next.price || 1000;
    appData.currentSheets = next.sheets || 1;
    saveData();
    render(true);
    playChime(880, 0.3);
  }

  // 완료(정산 포함) 또는 패스(정산 제외) 처리
  function finishCurrentWithSettle(isDone) {
    if (appData.currentNum === 0) {
      alert("진행 중인 손님이 없습니다.");
      return;
    }

    var now = new Date();
    var timeStr = (now.getHours() < 10 ? '0' : '') + now.getHours() + ':' + 
                  (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();

    // 정산 내역 객체 생성
    var settleRecord = {
      num: appData.currentNum,
      name: appData.currentName,
      opt: appData.currentOpt,
      price: isDone ? (appData.currentPrice || 1000) : 0,
      sheets: isDone ? (appData.currentSheets || 1) : 0,
      status: isDone ? 'DONE' : 'PASS',
      time: timeStr
    };

    appData.settlement.push(settleRecord);

    if (isDone) {
      showToast("💰 #" + appData.currentNum + "번 완료 (+ " + settleRecord.price.toLocaleString() + "원 정산)");
    } else {
      showToast("⏩ #" + appData.currentNum + "번 패스 (정산 제외)");
    }

    // 상태 초기화
    appData.currentNum = 0;
    appData.currentName = "준비 중";
    appData.currentOpt = "";
    appData.currentPrice = 0;
    appData.currentSheets = 0;

    saveData();
    render(true);
  }

  // 정산 모달 열기 및 계산
  function openSettleModal() {
    var totalAmount = 0;
    var totalSheets = 0;
    var countDone = 0;
    var countPass = 0;
    var listHtml = "";

    var sList = appData.settlement || [];

    for (var i = sList.length - 1; i >= 0; i--) {
      var item = sList[i];
      if (item.status === 'DONE') {
        totalAmount += item.price;
        totalSheets += item.sheets;
        countDone++;
        listHtml += '<div class="settle-row">' +
                      '<div>' +
                        '<span>' + item.time + '</span> ' +
                        '<strong>#' + item.num + ' ' + item.name + '</strong>' +
                      '</div>' +
                      '<div style="color:#10b981; font-weight:800;">+' + item.price.toLocaleString() + '원</div>' +
                    '</div>';
      } else {
        countPass++;
        listHtml += '<div class="settle-row pass-item">' +
                      '<div>' +
                        '<span>' + item.time + '</span> ' +
                        '<span>#' + item.num + ' ' + item.name + '</span>' +
                      '</div>' +
                      '<div style="color:#fca5a5; font-weight:700;">패스 (0원)</div>' +
                    '</div>';
      }
    }

    document.getElementById("settleTotalAmount").innerText = totalAmount.toLocaleString() + "원";
    document.getElementById("settleCountDone").innerText = countDone + "건";
    document.getElementById("settleTotalSheets").innerText = totalSheets + "장";
    document.getElementById("settleCountPass").innerText = countPass + "건";

    var listBox = document.getElementById("settleListBox");
    if (sList.length === 0) {
      listBox.innerHTML = '<div style="text-align:center; color:#9ca3af; font-size:0.78rem; padding:20px 0;">아직 처리된 내역이 없습니다.</div>';
    } else {
      listBox.innerHTML = listHtml;
    }

    document.getElementById("settleModal").style.display = "flex";
  }

  function closeSettleModal() {
    document.getElementById("settleModal").style.display = "none";
  }

  function setPresetMemo(text) {
    document.getElementById("noticeInput").value = text;
  }

  function enableNotice() {
    var val = document.getElementById("noticeInput").value.trim();
    if (!val) {
      alert("공지 문구를 입력해 주세요.");
      return;
    }
    appData.noticeText = val;
    appData.isNoticeActive = true;
    saveData();
    render(true);
    showToast("📢 강조 공지가 화면에 등록되었습니다!");
  }

  function disableNotice() {
    appData.isNoticeActive = false;
    saveData();
    render(true);
    showToast("공지 배너를 내렸습니다.");
  }

  function delOne(num) {
    if (!confirm("#" + num + "번 대기자를 취소하시겠습니까?")) return;
    appData.list = appData.list.filter(function(i) { return i.num !== num; });
    saveData();
    render(true);
  }

  function resetQueue() {
    if (!confirm("전체 대기열과 정산 내역을 완전히 초기화하시겠습니까?")) return;
    appData = {
      currentNum: 0,
      currentName: "준비 중",
      currentOpt: "",
      currentPrice: 0,
      currentSheets: 0,
      lastNum: 0,
      list: [],
      noticeText: "",
      isNoticeActive: false,
      settlement: []
    };
    saveData();
    render(true);
  }

  function showToast(msg) {
    var toast = document.getElementById("toastBox");
    toast.innerText = msg;
    toast.style.display = "block";
    setTimeout(function() {
      toast.style.display = "none";
    }, 2400);
  }

  function playChime(freq, dur) {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    } catch(e){}
  }

  function render(force) {
    var currentJson = JSON.stringify(appData);
    if (!force && currentJson === lastRenderedJson) {
      return;
    }
    lastRenderedJson = currentJson;

    // 강조 공지 배너
    var banner = document.getElementById("noticeBanner");
    if (appData.isNoticeActive && appData.noticeText) {
      banner.innerHTML = "📢 <strong>" + appData.noticeText + "</strong>";
      banner.style.display = "block";
    } else {
      banner.style.display = "none";
    }

    // 전광판 갱신
    var isOngoing = appData.currentNum > 0;
    var badgeText = isOngoing ? "진행 중 🎨" : "대기 중 💤";
    var numText = isOngoing ? "#" + appData.currentNum + "번" : "-";
    var nameText = isOngoing ? appData.currentName + " 님" : "다음 손님을 호출해 주세요";
    var optText = isOngoing ? "[" + appData.currentOpt + "]" : "";

    document.getElementById("statusBadge").innerText = badgeText;
    document.getElementById("liveNum").innerText = numText;
    document.getElementById("liveName").innerText = nameText;
    document.getElementById("liveOpt").innerText = optText;

    if (document.getElementById("adminStatusBadge")) {
      document.getElementById("adminStatusBadge").innerText = badgeText;
      document.getElementById("adminLiveNum").innerText = numText;
      document.getElementById("adminLiveName").innerText = nameText;
      document.getElementById("adminLiveOpt").innerText = optText;
    }

    var adminCurrentInfo = document.getElementById("adminCurrentInfo");
    if (adminCurrentInfo) {
      adminCurrentInfo.innerHTML = isOngoing
        ? "👉 <strong>#" + appData.currentNum + "번 " + appData.currentName + " 님</strong> [" + appData.currentOpt + "]"
        : "현재 대기 중 (호출 버튼 클릭)";
    }

    var waitCount = appData.list.length;
    document.getElementById("guestWaitCountText").innerText = "대기 " + waitCount + "명 (약 " + (waitCount * 3) + "분)";
    if (document.getElementById("adminWaitCountText")) {
      document.getElementById("adminWaitCountText").innerText = "총 " + waitCount + "명";
    }

    // 롤링 대기 명단 구성
    var tickerTrack = document.getElementById("guestTickerTrack");
    if (waitCount === 0) {
      tickerTrack.style.animation = "none";
      tickerTrack.innerHTML = '<div style="text-align: center; color: #9ca3af; font-size: 0.8rem; padding: 25px 0;">대기 중인 사람이 없습니다.</div>';
    } else {
      var itemHtml = "";
      for (var i = 0; i < waitCount; i++) {
        var row = appData.list[i];
        itemHtml += '<div class="queue-row">' +
                      '<div class="q-left">' +
                        '<span class="q-badge">#' + row.num + '</span>' +
                        '<span class="q-name">' + row.name + '</span>' +
                        '<span class="q-opt">[' + row.opt + ']</span>' +
                      '</div>' +
                      '<div style="font-size: 0.72rem; color: #9ca3af; font-weight: 700;">' + (i + 1) + '번째</div>' +
                    '</div>';
      }

      if (waitCount >= 3) {
        tickerTrack.innerHTML = itemHtml + itemHtml;
        var rollDuration = Math.max(12, waitCount * 3.5);
        tickerTrack.style.animation = "tickerRoll " + rollDuration + "s linear infinite";
      } else {
        tickerTrack.style.animation = "none";
        tickerTrack.innerHTML = itemHtml;
      }
    }

    // 관리자 정적 대기 리스트
    var adminList = document.getElementById("adminQueueList");
    if (adminList) {
      if (waitCount === 0) {
        adminList.innerHTML = '<div style="text-align: center; color: #9ca3af; font-size: 0.8rem; padding: 25px 0;">대기 중인 사람이 없습니다.</div>';
      } else {
        var aHtml = "";
        for (var j = 0; j < waitCount; j++) {
          var item = appData.list[j];
          aHtml += '<div class="queue-row">' +
                     '<div class="q-left">' +
                       '<span class="q-badge">#' + item.num + '</span>' +
                       '<span class="q-name">' + item.name + '</span>' +
                       '<span class="q-opt">[' + item.opt + ']</span>' +
                     '</div>' +
                     '<div>' +
                       '<button type="button" class="btn-del" onclick="delOne(' + item.num + ')">취소</button>' +
                     '</div>' +
                   '</div>';
        }
        adminList.innerHTML = aHtml;
      }
    }
  }

  window.addEventListener('storage', function() {
    loadData();
    render(false);
  });

  loadData();
  applyViewMode();
  render(true);
</script>
</body>
</html>
